<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cuentas Claras</title>
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentas Claras">
<link rel="manifest" href="manifest.webmanifest?v=14.1.01">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=14.1.01">
<link rel="icon" href="icons/favicon.svg?v=14.1.01" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png?v=14.1.01">
<style>
  /* ============================================================
     DISEÑO "TICKET DEL SÚPER"
     Todos los colores están en variables: el modo noche solo cambia estos valores.
     ============================================================ */
  @font-face{font-family:'Space Mono';font-weight:400;font-display:swap;src:url(fonts/SpaceMono-400.woff2) format('woff2')}
  @font-face{font-family:'Space Mono';font-weight:700;font-display:swap;src:url(fonts/SpaceMono-700.woff2) format('woff2')}
  @font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url(fonts/SpaceGrotesk.woff2) format('woff2')}

  /* ☀️ Modo día: papel de ticket + sello azul */
  :root{
    --bg:#e6e3dc;          /* el mostrador */
    --card:#fffefa;        /* el papel del ticket */
    --card2:#f1eee6;       /* papel un poco más gris (campos, chips) */
    --line:#d6d1c5;        /* líneas */
    --punteo:#b9b3a4;      /* líneas punteadas */
    --txt:#161616;         /* tinta */
    --muted:#615e57;       /* tinta gastada */
    --accent:#2340d9;      /* el sello */
    --accent-fondo:#2340d9;/* fondo de botones (en modo noche es metálico) */
    --accent-txt:#ffffff;
    --red:#c62828; --green:#23784a;
    --nav-bg:rgba(255,254,250,.94);
    --graf:#d6d1c5;
    --sombra:0 1px 0 #cfc9bb;
    --overlay:rgba(22,22,22,.45);
    --barra-sup:#161616;
    --r:3px;
    color-scheme:light;
  }
  /* 🌙 Modo noche: grafito con sello rojo cereza.
     Ojo: acá lo negativo/lo que debés va en naranja para no confundirse con los botones rojos. */
  :root[data-tema="oscuro"]{
    --bg:#0e0e10; --card:#18181b; --card2:#232327; --line:#313136; --punteo:#45454c;
    --txt:#f4f4f5; --muted:#a1a1aa;
    --accent:#ff3b5c;
    --accent-fondo:linear-gradient(135deg,#e8264c 0%,#d9143c 55%,#b80d31 100%);
    --accent-txt:#ffffff;
    --red:#ffa04d; --green:#6fdca5;
    --nav-bg:rgba(14,14,16,.94);
    --graf:#313136;
    --sombra:0 1px 0 #000;
    --overlay:rgba(0,0,0,.6);
    --barra-sup:#0e0e10;
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
    font-size:15px;-webkit-font-smoothing:antialiased}
  /* Franja de arriba (donde está la hora del celu): oscura, como la boca de la impresora del ticket */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--barra-sup);z-index:40}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
  h1,h2,h3,nav button,.btn,.seg button{font-family:'Space Grotesk',system-ui,sans-serif}
  h1{font-size:25px;margin:8px 0 2px;letter-spacing:1px;text-transform:uppercase}
  h2{font-size:15px;margin:24px 0 10px;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--txt);padding-bottom:6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--sombra)}
  /* Recuadro principal: franja de sello arriba y borde de ticket cortado abajo */
  .hero{border-top:6px solid var(--accent);padding-bottom:24px;
    -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/14px 100% repeat-x;
            mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/14px 100% repeat-x}
  .big{font-size:31px;font-weight:700;letter-spacing:-1px}
  .label{color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 .card{margin:0}
  .mid{font-size:19px;font-weight:700;letter-spacing:-.5px}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--punteo)}
  .item:last-child{border-bottom:0}
  .ico{width:40px;height:40px;border-radius:4px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
  .grow{flex:1;min-width:0}
  .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s{color:var(--muted);font-size:12px;margin-top:2px}
  .amt{font-weight:700;white-space:nowrap}
  .neg{color:var(--red)} .pos{color:var(--green)}
  /* "Pagado": como un sello estampado, un poco torcido */
  .pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:3px;border:1.5px solid var(--accent);color:var(--accent);
    text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:transparent;transform:rotate(-4deg)}
  .empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}
  .bar{height:8px;background:var(--card2);border-radius:0;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--accent-fondo)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700;border-radius:4px;padding:14px;width:100%;font-size:15px;text-transform:uppercase;letter-spacing:1px}
  .btn.sec{background:var(--card2);color:var(--txt)}
  .btn.danger{background:transparent;color:var(--red);border:1.5px dashed var(--red)}
  .btn.sm{width:auto;padding:8px 12px;font-size:13px;white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 12px;border-radius:4px;background:var(--card2);font-size:13px}
  .chip.on{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700}
  .chip.on span{color:inherit!important}
  .monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:12px}
  .monthnav button{width:40px;height:40px;border-radius:4px;font-size:20px}
  /* barra de abajo */
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1.5px dashed var(--txt);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
  @media (min-width:600px){
    nav{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}
    .fab{right:calc((100% - 560px)/2 + 18px)}
  }
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 6px;min-width:58px}
  nav button.on{color:var(--accent);font-weight:700}
  .fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:6px;
    background:var(--accent-fondo);color:var(--accent-txt);box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:11;display:grid;place-items:center;padding:0;
    transition:transform .25s,opacity .25s}
  .fab.escondido{transform:translateY(24px) scale(.6);opacity:0;pointer-events:none}
  /* Efecto al bajar: cada bloque de la pantalla se mueve solo (lo maneja efectoScroll) */
  #main > *{position:relative;z-index:1;transform-origin:50% 0}
  /* hoja que sube desde abajo */
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:10px 10px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(60px)}to{transform:none}}
  .sheet h3{margin:4px 0 14px;font-size:19px;text-transform:uppercase;letter-spacing:1px;padding-right:44px}
  .handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
  .cerrar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:4px;background:var(--card2);color:var(--muted);display:grid;place-items:center;padding:0}
  label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:4px;
    padding:13px 12px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{border-color:var(--accent)}
  .seg{display:flex;background:var(--card2);border-radius:4px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border-radius:3px;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700}
  .actions{display:grid;gap:10px;margin-top:18px}
  .seg-chico button{padding:10px 2px;font-size:12px}
  .welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .welcome .emoji{font-size:64px}
  .emojis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .emojis button{font-size:28px;width:52px;height:52px;border-radius:4px;background:var(--card2)}
  .emojis button.on{outline:2px solid var(--accent)}
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);border:1.5px dashed var(--txt);
    padding:10px 16px;border-radius:4px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  /* íconos de bancos y billeteras */
  .ico.marca{font-weight:700;letter-spacing:-.5px;font-family:'Space Grotesk',system-ui,sans-serif}
  .marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:220px;overflow:auto;padding:2px}
  .marca-op{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:4px;background:var(--card2);font-size:10px;color:var(--muted)}
  .marca-op span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .marca-op.on{outline:2px solid var(--accent);color:var(--txt)}
  .mini-card{position:relative;width:56px;height:38px;border-radius:5px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25);overflow:hidden;font-family:'Space Grotesk',sans-serif}
  .mc-banco{position:absolute;left:5px;top:3px;font-size:9px;font-weight:700}
  .mc-chip{position:absolute;left:6px;top:16px;width:10px;height:8px;border-radius:2px;background:linear-gradient(135deg,#f6d77a,#c9a240)}
  .mc-red{position:absolute;right:5px;bottom:3px;font-size:8px;font-weight:700;font-style:italic;text-transform:uppercase;opacity:.95}
  .rinde{color:var(--green);font-size:11px;margin-top:2px}
  /* gráfico de meses */
  .graf{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:22px}
  .graf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .graf-val{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;letter-spacing:-.5px}
  .graf-col.on .graf-val{color:var(--txt);font-weight:700}
  .graf-barra{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;gap:2px;overflow:hidden;min-height:2px}
  .graf-barra i{display:block;width:100%;background:color-mix(in srgb,var(--accent) 28%,var(--graf))}
  :root[data-tema="oscuro"] .graf-barra i{background:color-mix(in srgb,var(--accent) 16%,var(--graf))}
  .graf-barra.actual i{background:var(--accent-fondo)}
  .graf-mes{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1.5px solid var(--txt);width:100%;text-align:center}
  .graf-col.on .graf-mes{color:var(--txt);font-weight:700}
  .leyenda{display:grid;gap:8px;margin-top:14px;font-size:14px}
  .leyenda .row span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
  .punto{width:10px;height:10px;border-radius:2px;flex:none}
  /* elegir billetera */
  .billes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
  .bille-op{flex:none;width:100px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:4px;background:var(--card2);font-size:12px}
  .bille-op span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .bille-op small{color:var(--muted);font-size:10px;white-space:nowrap}
  .bille-op.on{outline:2px solid var(--accent)}
  .conv{color:var(--muted);font-size:12px;margin-top:8px}
  /* íconos */
  .i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  .i .ac{stroke:var(--accent)} .i .rel{fill:currentColor;stroke:none} .i .ac-rel{fill:var(--accent)}
  .i-in{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.24em;margin-right:5px}
  .con-ico{display:flex;align-items:center;gap:2px}
  .ico{color:var(--txt)} .ico .i{width:22px;height:22px}
  .ico.cat{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
  .ico.cat .i .ac{stroke:currentColor}
  nav button .i{width:25px;height:25px;margin-bottom:2px}
  .pill .i-in{width:1em;height:1em;margin-right:4px;vertical-align:-.15em}
  .pill.sin-sello{transform:none;border-color:var(--line);color:var(--txt)}
  /* Animación de entrada: fondo del color del modo, borroso, y el sello que se arma en el medio */
  .intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
    background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:opacity .45s}
  .intro.fuera{opacity:0;pointer-events:none}
  .intro .logo{width:min(64vw,260px);height:auto;overflow:visible}
  .intro .anillo{transform-box:fill-box;transform-origin:center;animation:aparecer .55s cubic-bezier(.2,1.5,.45,1) both}
  .intro .anillo2{transform-box:fill-box;transform-origin:center;animation:aparecer .5s .15s cubic-bezier(.2,1.5,.45,1) both}
  .intro .gente{animation:subir .5s .45s cubic-bezier(.2,1.3,.4,1) both}
  .intro .puntos{animation:fundido .3s both;animation-delay:var(--fin,2s)}
  @keyframes aparecer{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes subir{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fundido{from{opacity:0}to{opacity:1}}
  .compara{display:inline-block;margin-top:10px;font-size:12px;padding:5px 9px;border-radius:4px;background:var(--card2);color:var(--muted)}
  .compara.sube{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
  .compara.baja{background:color-mix(in srgb,var(--green) 14%,var(--card));color:var(--green)}
  /* inversiones */
  .reparto{display:flex;gap:2px;height:12px;margin:14px 0 10px;overflow:hidden}
  .reparto i{display:block;height:100%}
  .reparto-ley{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
  .reparto-ley span{display:flex;align-items:center;gap:6px}
  .gan{display:inline-block;font-size:12px;font-weight:700;padding:3px 7px;border-radius:4px;margin-top:3px}
  .gan.pos{background:color-mix(in srgb,var(--green) 15%,var(--card))} .gan.neg{background:color-mix(in srgb,var(--red) 15%,var(--card))}
  /* logo */
  .logo text{font-family:'Space Grotesk',system-ui,sans-serif}
  .logo-bienvenida{width:190px;height:190px;margin:0 auto 6px}
  .logo-bienvenida svg,.pie svg{width:100%;height:100%;display:block}
  .pie{text-align:center;margin:28px 0 20px}.pie svg{width:110px;height:110px;margin:0 auto 6px}
  .avatar{width:44px;height:44px;border-radius:4px;background:var(--card2);display:grid;place-items:center;font-size:24px}
/* ============================================================
     TICKET 2 (versión 14): renglones con puntitos, total con doble raya,
     código de barras y vencimientos conectados
     ============================================================ */
html,body{font-variant-numeric:tabular-nums}
h1{letter-spacing:.5px}
h2{border:0;text-align:center;letter-spacing:4px;font-size:13px;margin:30px 0 12px;display:flex;align-items:center;gap:12px;padding:0}
h2::before,h2::after{content:'';flex:1;border-top:1.5px dashed var(--punteo)}
.card{border:0;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
/* El total como el final de un ticket */
.hero{border-top:0;padding:18px 18px 34px}
.hero .label{display:flex;justify-content:space-between}
.hero .big{border-top:3px double var(--txt);border-bottom:3px double var(--txt);padding:10px 0 8px;margin:8px 0 10px;font-size:34px}
.hero::after{content:'';display:block;height:34px;margin-top:14px;opacity:.85;
  background:repeating-linear-gradient(90deg,var(--txt) 0 2px,transparent 2px 4px,var(--txt) 4px 5px,transparent 5px 8px,var(--txt) 8px 11px,transparent 11px 12px,var(--txt) 12px 13px,transparent 13px 17px,var(--txt) 17px 19px,transparent 19px 21px)}
.hero .s{letter-spacing:.3px}
/* Talón doble: las dos tarjetas son un mismo papel con troquel en el medio */
.grid2{gap:0}
.grid2 .card:first-child{border-radius:var(--r) 0 0 var(--r);border-right:1.5px dashed var(--punteo)}
.grid2 .card:last-child{border-radius:0 var(--r) var(--r) 0}
/* Renglones de ticket: nombre ....... importe */
.item .grow{background:radial-gradient(circle,var(--punteo) 1.1px,transparent 1.6px) 0 14px/7px 4px repeat-x}
.item .grow .t{display:inline-block;max-width:100%;background:var(--card);padding-right:8px;vertical-align:top}
.item .grow .s{background:var(--card);display:table;padding-right:8px}
.item .amt{background:var(--card);padding-left:2px}
.item{border-bottom:1px solid var(--line)}
.ico{border-radius:2px}
.label{letter-spacing:1.5px}
.btn{letter-spacing:2px}
.pill{transform:rotate(-5deg)}
nav{border-top:1.5px dashed var(--txt)}
nav button.on{position:relative}
nav button.on::after{content:'';position:absolute;left:30%;right:30%;bottom:-2px;border-bottom:2px solid var(--accent)}
.sheet{border-radius:0;-webkit-mask:radial-gradient(circle 6px at 50% 0,#0000 97%,#000) 50% 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 0,#0000 97%,#000) 50% 0/14px 100% repeat-x;padding-top:24px}
.grid2 .label{letter-spacing:.4px}
/* La línea del ticket: lo que hay que pagar, encadenado con una raya punteada del color del sello */
.linea .item{position:relative;border-bottom:0}
.linea .item::before{content:'';position:absolute;left:27px;top:0;bottom:0;border-left:2px dashed var(--accent)}
.linea .item:first-child::before{top:50%}
.linea .item:last-child::before{bottom:50%}
.linea .item:only-child::before{display:none}
.linea .item .ico{margin:0 8px;position:relative;z-index:1;box-shadow:0 0 0 4px var(--card)}
.linea .item .mini-card{position:relative;z-index:1;box-shadow:0 0 0 4px var(--card)}
.linea .proximo .ico,.linea .proximo .mini-card{outline:2px solid var(--accent);outline-offset:3px}
.linea .item:has(.pill) .ico{opacity:.45}
.linea .proximo .t{overflow:visible}
.linea .proximo .t::after,.cuota.proximo::after{content:'Próximo';display:inline-block;margin-left:10px;font-size:10px;padding:1px 6px;border:1.5px solid var(--accent);color:var(--accent);
  text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-radius:3px;transform:rotate(-6deg);vertical-align:2px;background:var(--card)}
.cuota{position:relative}
.cuota+.cuota::before{content:'';position:absolute;left:43px;top:-13px;height:13px;border-left:2px dashed var(--accent)}
.cuota.proximo{box-shadow:0 0 0 1.5px var(--accent)}
.cuota.proximo::after{content:'Próxima';position:absolute;top:-9px;right:16px;margin:0}
/* La hora en el total, como la que imprime el ticket; los dos puntitos titilan */
.hero .label{gap:10px}
.reloj{white-space:nowrap;letter-spacing:1px}
.reloj b{animation:titila 2s steps(2,end) infinite;font-weight:400}
@keyframes titila{50%{opacity:.15}}
/* El sello de "Próximo" cae sobre el papel como un sello de goma, y después respira suave */
.linea .proximo .t::after,.cuota.proximo::after{animation:sellar .45s .25s cubic-bezier(.3,1.6,.5,1) both, respirar 3.2s 1s ease-in-out infinite}
@keyframes sellar{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
@keyframes respirar{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(-6deg) scale(1.08)}}
/* "Atrasada": el mismo sello, en rojo (de noche, naranja como todo lo que debés) */
.linea .atrasada .t{overflow:visible}
.linea .atrasada .t::after,.cuota.atrasada::after{content:'Atrasada';display:inline-block;margin-left:10px;font-size:10px;padding:1px 6px;
  border:1.5px solid var(--red);color:var(--red);text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-radius:3px;
  transform:rotate(-6deg);vertical-align:2px;background:var(--card);
  animation:sellar .45s .25s cubic-bezier(.3,1.6,.5,1) both, respirar 3.2s 1s ease-in-out infinite}
.linea .atrasada .ico,.linea .atrasada .mini-card{outline:2px solid var(--red);outline-offset:3px}
.cuota.atrasada{box-shadow:0 0 0 1.5px var(--red)}
/* Botón "La pagó otra persona" en la hoja de pago */
.otra-op{margin-top:14px;display:flex;align-items:center;gap:4px}
/* Resumen corto de meses en Gastos */
.meses{padding-top:10px;padding-bottom:6px}
.mes-fila{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;align-items:center;width:100%;text-align:right;padding:9px 0;border-bottom:1.5px dashed var(--punteo);font-size:13px}
.mes-fila>span{white-space:nowrap}
.mes-fila>span:first-child{text-align:left;font-weight:700}
.mes-fila.en-uso>span:first-child{color:var(--accent)}
.mes-tit{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding-top:0}
.mes-tit>span:first-child{font-weight:400}
.ver-mas{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ver-mas .i{width:16px;height:16px}
/* El mes: una sola línea de resumen y las compras que terminaste */
.mes-linea{margin-top:12px;font-size:13px;color:var(--muted)}
.mes-linea b{white-space:nowrap}
.mes-term{margin-top:14px;border-top:1.5px dashed var(--punteo);padding-top:10px}
.mes-term-fila{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}
.mes-term-fila span{display:flex;align-items:center;gap:2px;min-width:0}
.mes-term-fila .i-in{color:var(--green)}
.mes-term-fila b{white-space:nowrap}
/* Aviso de terminadas en Cuotas */
.aviso-term{display:block;width:100%;text-align:left;margin:22px 0 8px;padding:12px 14px;border:1.5px dashed var(--punteo);border-radius:var(--r);font-size:13px}
.aviso-term span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
/* Tabla de los cuatro dólares */
.dol-fila{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;width:100%;text-align:right;padding:11px 0;border-bottom:1.5px dashed var(--punteo);font-size:14px}
.dol-fila>span:first-child{text-align:left;font-weight:700;display:flex;align-items:center;gap:8px}
.dol-fila .pill{font-size:9px;padding:2px 6px}
.dol-tit{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding-top:0}
.dol-tit>span:first-child{font-weight:400}
.dol-fila.en-uso .amt{color:var(--accent)}
.dol-cambio{margin-top:10px;font-size:12.5px;color:var(--muted)}
.dol-imp-fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1.5px dashed var(--punteo);font-size:13px}
.dol-imp-fila span{display:flex;flex-direction:column;min-width:0}
.dol-imp-fila small{color:var(--muted);font-size:11px;margin-top:1px}
.dol-imp-fila b{white-space:nowrap}
.dol-imp-total{border-bottom:0;border-top:3px double var(--txt);margin-top:4px;font-weight:700}
/* "● en vivo" al lado del dólar: el puntito titila */
.vivo{color:var(--green);white-space:nowrap}
.vivo{animation:titila 2s steps(2,end) infinite}
.cuota.atrasada::after{position:absolute;top:-9px;right:16px;margin:0}
@media (prefers-reduced-motion:reduce){.linea .proximo .t::after,.cuota.proximo::after,.linea .atrasada .t::after,.cuota.atrasada::after,.reloj b{animation:none}}
</style>
</head>
<body>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Agregar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="intro" id="intro" aria-hidden="true"></div>

<script>
/* ============================================================
   Cuentas Claras — app personal (PWA)
   Todo se guarda en el teléfono (localStorage). Nada se sube a internet.
   ============================================================ */

const STORAGE_KEY = 'finanzas-v1';
const VERSION_APP = '14.1.01'; // subilo junto con el de sw.js, así sabés en Ajustes qué versión tenés

// Logo "Cuentas claras": usa los colores del modo actual (azul de día, cereza de noche)
function logoSello(u='l', A='var(--txt)', B='var(--accent)', P='var(--bg)'){
  return `<svg xmlns="http://www.w3.org/2000/svg" class="logo" viewBox="0 0 256 256"><g transform="rotate(-8 128 128)"><circle class="anillo" cx="128" cy="128" r="118" fill="none" stroke="${B}" stroke-width="10"/><defs><path id="arr-${u}" d="M40 128 A88 88 0 0 1 216 128"/><path id="aba-${u}" d="M30 128 A98 98 0 0 0 226 128"/></defs>
<text font-family="Space Grotesk" font-weight="700" font-size="24" letter-spacing="3" fill="${B}"><textPath href="#arr-${u}" startOffset="50%" text-anchor="middle">CUENTAS CLARAS</textPath></text>
<text font-family="Space Grotesk" font-weight="500" font-size="15" letter-spacing="2" fill="${B}"><textPath href="#aba-${u}" startOffset="50%" text-anchor="middle">CONSERVAN LA AMISTAD</textPath></text>
<g class="puntos" fill="${B}"><circle cx="37" cy="128" r="5"/><circle cx="219" cy="128" r="5"/></g>
<circle class="anillo2" cx="128" cy="128" r="80" fill="none" stroke="${B}" stroke-width="4"/><defs><clipPath id="rec-${u}"><circle cx="128" cy="128" r="75"/></clipPath></defs>
<g class="gente" clip-path="url(#rec-${u})"><g transform="translate(48 42) scale(0.66)"><path d="M104 330 V184 Q104 126 158 126 Q212 126 212 184 V330 H104 Z" fill="${B}"/>
<circle cx="150" cy="82" r="30" fill="${B}"/>
<path d="M44 330 V184 Q44 126 98 126 Q152 126 152 184 V330 H44 Z" fill="${A}" stroke="${P}" stroke-width="9" paint-order="stroke"/>
<circle cx="104" cy="82" r="30" fill="${A}" stroke="${P}" stroke-width="8" paint-order="stroke"/>
<path d="M122 184 Q164 146 206 160" fill="none" stroke="${P}" stroke-width="33" stroke-linecap="round"/>
<path d="M122 184 Q164 146 206 160" fill="none" stroke="${A}" stroke-width="20" stroke-linecap="round"/>
<circle cx="47" cy="158" r="16" fill="${B}" stroke="${P}" stroke-width="7" paint-order="stroke"/></g></g></g></svg>`;
}


// ---------- Datos fijos ----------
const CATEGORIAS = [
  {id:'comida',     nombre:'Comida',      ic:'comida'},
  {id:'super',      nombre:'Súper',       ic:'super'},
  {id:'transporte', nombre:'Transporte',  ic:'transporte'},
  {id:'salidas',    nombre:'Salidas',     ic:'salidas'},
  {id:'servicios',  nombre:'Servicios',   ic:'servicios'},
  {id:'facu',       nombre:'Facultad',    ic:'facu'},
  {id:'gym',        nombre:'Gimnasio',    ic:'gym'},
  {id:'ropa',       nombre:'Ropa',        ic:'ropa'},
  {id:'salud',      nombre:'Salud',       ic:'salud'},
  {id:'subs',       nombre:'Suscripciones', ic:'subs'},
  {id:'cuotas',     nombre:'Cuotas',      ic:'tarjeta'},
  {id:'otros',      nombre:'Otros',       ic:'otros'},
];
const CATEGORIAS_INGRESO = [
  {id:'laburo',  nombre:'Laburo',   ic:'laburo'},
  {id:'sueldo',  nombre:'Sueldo',   ic:'billete'},
  {id:'changa',  nombre:'Changa',   ic:'changa'},
  {id:'regalo',  nombre:'Regalo',   ic:'regalo'},
  {id:'otros_i', nombre:'Otros',    ic:'entrada'},
];
const TIPOS_INVERSION = ['Plazo fijo','FCI','Dólares','Cripto','Acciones/CEDEARs','Bonos','Otro'];
const TIPOS_DOLAR = [
  {id:'blue',    nombre:'Blue'},
  {id:'bolsa',   nombre:'MEP'},
  {id:'oficial', nombre:'Oficial'},
  {id:'tarjeta', nombre:'Tarjeta'},
];
const EMOJIS_AVATAR = ['😎','🤑','🦊','🐸','🚀','🔥','🐱','👾','🦁','🍀'];

// ---------- Estado ----------
let state = loadState();
let vista = 'inicio';
let mesVisto = mesActual(); // "2026-11"

function estadoVacio(){
  return {
    usuario: null,                    // {nombre, emoji}
    billeteras: [],                   // {id, nombre, moneda:'ARS'|'USD', saldoInicial}
    movimientos: [],                  // {id, tipo:'gasto'|'ingreso', monto, billeteraId, categoria, fecha, nota}
    deudas: [],                       // {id, clase:'tarjeta'|'persona', direccion:'debo'|'medeben', descripcion, quien, moneda, montoCuota, cuotasTotales, cuotasPagadas, diaVencimiento}
    inversiones: [],                  // {id, nombre, tipo, moneda, invertido, valorActual, actualizado}
    suscripciones: [],                // mensualidades: {id, nombre, moneda, monto, dia, cada (meses), billeteraId, ultimoPago:'2026-11'}
    dolar: {tipo:'blue', valor:null, actualizado:null, manual:false},
    tema: 'auto',                     // 'auto' (como el celu) | 'claro' | 'oscuro'
    usdt:  {exchange:'lemoncash', valor:null, actualizado:null, manual:false}, // precio de VENTA de 1 USDT en pesos
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const datos = Object.assign(estadoVacio(), JSON.parse(raw));
      datos.usdt = Object.assign(estadoVacio().usdt, datos.usdt); // por si venís de la versión 1
      return datos;
    }
  }catch(e){}
  return estadoVacio();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ toast('No se pudo guardar'); }
}

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function hoyISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function mesActual(){ return hoyISO().slice(0,7); }
function nombreMes(ym){
  const [y,m] = ym.split('-').map(Number);
  const mes = new Date(y, m-1, 1).toLocaleDateString('es-AR',{month:'long'});
  return mes.charAt(0).toUpperCase() + mes.slice(1) + ' ' + y;
}
function moverMes(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function plata(n, moneda='ARS'){
  const num = Number(n)||0;
  const txt = num.toLocaleString('es-AR',{minimumFractionDigits: (moneda!=='ARS' || !Number.isInteger(num))?2:0, maximumFractionDigits:2});
  if(moneda==='USDT') return txt + ' USDT';
  return (moneda==='USD' ? 'US$ ' : '$ ') + txt;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
// Entiende "1.500,50", "1500,5", "1500.5" y "1.500"
function num(v){
  let s = String(v??'').trim().replace(/[^\d.,-]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');          // coma = decimal
  else if(/\.\d{3}$/.test(s) && (s.match(/\./g)||[]).length>=1 && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g,''); // punto de miles
  return parseFloat(s) || 0;
}
function fechaCorta(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}`; }

function billetera(id){ return state.billeteras.find(b=>b.id===id); }
function monedaDe(mov){ const b=billetera(mov.billeteraId); return b ? b.moneda : (mov.moneda||'ARS'); }
// Cada categoría tiene SIEMPRE el mismo color (en el gráfico, la lista y el formulario)
const COLOR_CAT = {
  comida:'#e8833a', super:'#3f8ee6', transporte:'#17a57a', salidas:'#d9a400', servicios:'#d5568a', facu:'#7b6be0',
  gym:'#2f9e44', ropa:'#e05656', salud:'#14a3b8', subs:'#a35bd6', cuotas:'#7d8597', otros:'#9a8a78',
  laburo:'#2f9e6b', sueldo:'#2f9e6b', changa:'#c98a1d', regalo:'#d5568a', otros_i:'#5b84d6',
};
function colorCat(id){ return COLOR_CAT[id] || '#9a8a78'; }
// Cuadradito con el ícono de la categoría, teñido con su color
function icoCat(id){ const c=categoria(id); return `<div class="ico cat" style="--c:${colorCat(id)}">${ic(c.ic)}</div>`; }
function categoria(id){ return [...CATEGORIAS,...CATEGORIAS_INGRESO].find(c=>c.id===id) || {nombre:'Otros',ic:'otros'}; }

// Convierte a pesos usando la cotización guardada (si no hay, devuelve null para USD)
function aPesos(monto, moneda){
  if(moneda==='ARS') return monto;
  if(moneda==='USDT') return state.usdt.valor ? monto * state.usdt.valor : null;
  if(!state.dolar.valor) return null;
  return monto * state.dolar.valor;
}

function saldoBilletera(b){
  let saldo = Number(b.saldoInicial)||0;
  for(const m of state.movimientos){
    if(m.billeteraId!==b.id) continue;
    saldo += m.tipo==='ingreso' ? m.monto : -m.monto;
  }
  return saldo;
}

// Cada vez que abrís la app se sortea: 3 de cada 4 veces en español, 1 de cada 4 en portugués
const SALUDO_PORTUGUES = Math.random() < 0.25;
function saludo(){
  const h = new Date().getHours();
  const momento = h<6 ? 'noche' : h<13 ? 'dia' : h<20 ? 'tarde' : 'noche';
  const es = {dia:'Buen día', tarde:'Buenas tardes', noche:'Buenas noches'};
  const pt = {dia:'Bom dia',  tarde:'Boa tarde',     noche:'Boa noite'};
  return (SALUDO_PORTUGUES ? pt : es)[momento];
}

// ---------- Cotización del dólar ----------
async function actualizarDolar(forzar=false){
  // Trae los cuatro dólares juntos (para la tabla de Inicio) y usa el que elegiste en Ajustes
  const hace = state.dolares?.actualizado ? (Date.now()-state.dolares.actualizado) : Infinity;
  if(!forzar && hace < 1000*50) return; // como mucho una vez por minuto
  try{
    const r = await fetch('https://dolarapi.com/v1/dolares', {cache:'no-store'});
    if(!r.ok) throw 0;
    const lista = await r.json();
    const antes = JSON.stringify(state.dolares?.valores||{});
    const valores = {};
    for(const d of lista){ if(d.venta) valores[d.casa] = {compra:Number(d.compra)||null, venta:Number(d.venta)}; } // incluye "cripto" y "bolsa" (MEP) para el cálculo de abajo
    state.dolares = {valores, actualizado:Date.now()};
    let cambio = JSON.stringify(valores)!==antes;
    const elegido = valores[state.dolar.tipo];
    if(elegido && !state.dolar.manual){
      cambio = cambio || elegido.venta!==state.dolar.valor;
      state.dolar.valor = elegido.venta;
      state.dolar.actualizado = Date.now();
    }
    if(elegido && forzar && state.dolar.manual){ state.dolar.valor = elegido.venta; state.dolar.actualizado = Date.now(); state.dolar.manual = false; cambio = true; }
    save(); if(cambio || forzar) renderSuave();
    if(forzar) toast('Dólar actualizado');
    actualizarDolarAyer();
  }catch(e){
    if(forzar) toast('Sin conexión: uso la última cotización');
  }
}

// ---------- Cuánto cambió el dólar desde ayer ----------
// Cada dólar que tenés se mueve con su propio precio:
//  - Billeteras en dólares y otras inversiones: el dólar que elegiste (Blue, MEP...)
//  - USDT e inversiones cripto: el dólar cripto
//  - CEDEARs, acciones y bonos: el MEP (bolsa)
function dolaresPorLugar(){
  const g = {};
  const sumar = (casa, nombre, monto) => { if(!(monto>0)) return; const k=casa+'|'+nombre; (g[k] ||= {casa, nombre, monto:0}).monto += monto; };
  for(const b of state.billeteras){
    const s = saldoBilletera(b);
    if(b.moneda==='USD') sumar(state.dolar.tipo, 'Billeteras en dólares', s);
    if(b.moneda==='USDT') sumar('cripto', 'USDT', s);
  }
  for(const i of state.inversiones){
    if(i.moneda!=='USD') continue;
    const v = Number(i.valorActual)||0;
    if(i.tipo==='Acciones/CEDEARs' || i.tipo==='Bonos') sumar('bolsa', 'CEDEARs y bonos', v);
    else if(i.tipo==='Cripto') sumar('cripto', 'Cripto', v);
    else sumar(state.dolar.tipo, 'Otras inversiones en dólares', v);
  }
  return Object.values(g);
}
const NOMBRE_CASA = {blue:'Blue', bolsa:'MEP', oficial:'Oficial', tarjeta:'Tarjeta', cripto:'dólar cripto'};
// Busca el cierre del día anterior de cada dólar que haga falta (ArgentinaDatos guarda uno por día; si ayer fue feriado, va para atrás)
async function actualizarDolarAyer(){
  const hoy = hoyISO();
  if(!state.dolarAyer?.valores || state.dolarAyer.buscado!==hoy) state.dolarAyer = {buscado:hoy, valores:{}};
  const casas = [...new Set([state.dolar.tipo, ...dolaresPorLugar().map(x=>x.casa)])].filter(c=>!state.dolarAyer.valores[c]);
  if(!casas.length) return;
  try{
    for(const casa of casas){
      for(let i=1;i<=6;i++){
        const d = new Date(); d.setDate(d.getDate()-i);
        const r = await fetch(`https://api.argentinadatos.com/v1/cotizaciones/dolares/${casa}/${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`, {cache:'no-store'});
        if(!r.ok) continue;
        const x = await r.json();
        if(x && x.venta){ state.dolarAyer.valores[casa] = {fecha:x.fecha, venta:Number(x.venta)}; break; }
      }
    }
    save(); renderSuave();
  }catch(e){ /* sin internet: se vuelve a intentar en la próxima actualización */ }
}
// Texto para Inicio: cuánto subió o bajó, y cuánto cambian en pesos tus dólares según dónde los tengas
function cambioDolarTxt(){
  const ayer = state.dolarAyer?.valores || {}, hoyV = state.dolares?.valores || {};
  const pct = (a,b) => { const p=(a-b)/b*100; return (p>0?'+':p<0?'−':'')+Math.abs(p).toLocaleString('es-AR',{maximumFractionDigits:1})+'%'; };
  const plataSigno = n => (n>0?'+':n<0?'−':'')+plata(Math.round(Math.abs(n)));
  const clase = n => n>0?'pos':n<0?'neg':'';
  let html = '';
  const a = ayer[state.dolar.tipo], h = hoyV[state.dolar.tipo];
  if(a && h){
    const dif = h.venta - a.venta, cuando = a.fecha===moverDia(hoyISO(),-1) ? 'ayer' : 'el '+fechaCorta(a.fecha);
    html += Math.abs(dif)<0.005 ? `<div class="s dol-cambio">El ${nombreDolar()} está igual que ${cuando}.</div>`
      : `<div class="s dol-cambio">El ${nombreDolar()} ${dif>0?'subió':'bajó'} <b class="${clase(dif)}">${dif>0?'+':'−'}${plata(Math.abs(dif))} (${pct(h.venta,a.venta)})</b> desde ${cuando}.</div>`;
  }
  const filas = dolaresPorLugar().map(g=>{
    const ay = ayer[g.casa], ho = hoyV[g.casa]; if(!ay || !ho) return null;
    return {...g, efecto:(ho.venta-ay.venta)*g.monto, pct:pct(ho.venta,ay.venta)};
  }).filter(Boolean);
  if(filas.length){
    const total = filas.reduce((x,f)=>x+f.efecto,0);
    html += `<div class="dol-imp">
      <div class="label" style="margin:12px 0 2px">Cómo te afecta en pesos</div>
      ${filas.map(f=>`<div class="dol-imp-fila"><span>${f.nombre}<small>${plata(Math.round(f.monto*100)/100,'USD')} · ${NOMBRE_CASA[f.casa]||f.casa} ${f.pct}</small></span><b class="${clase(f.efecto)}">${plataSigno(f.efecto)}</b></div>`).join('')}
      ${filas.length>1?`<div class="dol-imp-fila dol-imp-total"><span>Total</span><b class="${clase(total)}">${plataSigno(total)}</b></div>`:''}
    </div>`;
  }
  return html;
}

const EXCHANGES_USDT = [
  {id:'lemoncash', nombre:'Lemon'},
  {id:'belo',      nombre:'Belo'},
  {id:'buenbit',   nombre:'Buenbit'},
  {id:'ripio',     nombre:'Ripio'},
  {id:'fiwind',    nombre:'Fiwind'},
];
async function actualizarUSDT(forzar=false){
  if(state.usdt.manual && !forzar) return;
  const hace = state.usdt.actualizado ? (Date.now()-state.usdt.actualizado) : Infinity;
  if(!forzar && hace < 1000*50) return; // como mucho una vez por minuto
  try{
    // CriptoYa devuelve {ask, totalAsk, bid, totalBid}. "bid" = a cuánto te lo compran = tu precio de VENTA
    // Usamos "bid" (el que muestra Lemon); "totalBid" le descuenta comisiones y da un poco menos
    const r = await fetch(`https://criptoya.com/api/${state.usdt.exchange}/usdt/ars/1`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    const venta = Number(d.bid || d.totalBid);
    if(venta > 0){
      const cambio = venta!==state.usdt.valor || state.usdt.manual;
      state.usdt.valor = venta;
      state.usdt.actualizado = Date.now();
      state.usdt.manual = false;
      save(); if(cambio || forzar) renderSuave();
      if(forzar) toast('USDT actualizado');
    }
  }catch(e){
    if(forzar) toast('No pude traer el USDT: uso el último guardado');
  }
}
// Vuelve a dibujar la pantalla sin llevarte arriba de todo (para cuando cambia algo solo, como el dólar).
// Si tenés una hoja abierta no toca nada: se ve en la próxima actualización.
function renderSuave(){
  if(!state.usuario || document.body.dataset.bloqueado) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

}, 60000);

// ---------- Tasas automáticas de las billeteras (TNA) ----------
// Datos públicos de ArgentinaDatos (api.argentinadatos.com):
//  - Billeteras en pesos que invierten en un fondo: la TNA sale de cuánto subió la cuotaparte del fondo entre los dos últimos días.
//  - Exchanges cripto: publican su rendimiento anual (APY), que pasamos a TNA.
// Las que no publican tasa (Naranja X, Brubank, Personal Pay, Cuenta DNI...) se siguen cargando a mano.
const FUENTES_TASA = {
  // Billeteras con su propio fondo
  'mp|ARS':        {fondo:'Mercado Fondo - Clase A', texto:'el fondo de Mercado Pago (Mercado Fondo)'},
  'uala|ARS':      {fondo:'Ualintec Ahorro Pesos - Clase A', texto:'el fondo de Ualá (Ualintec Ahorro Pesos)'},
  'cocos|ARS':     {fondo:'Cocos Ahorro - Clase A', texto:'el fondo de Cocos (Cocos Ahorro)'},
  // Bancos: el fondo "money market" de cada uno (si tenés la plata invertida ahí)
  'galicia|ARS':   {fondo:'Fima Premium - Clase A', texto:'el fondo de Galicia (Fima Premium)'},
  'santander|ARS': {fondo:'Super Ahorro $ - Clase A', texto:'el fondo de Santander (Super Ahorro $)'},
  'bbva|ARS':      {fondo:'FBA Money Market Pesos - Clase A', texto:'el fondo de BBVA (FBA Money Market Pesos)'},
  'macro|ARS':     {fondo:'Pionero Pesos - Clase A', texto:'el fondo de Macro (Pionero Pesos)'},
  'provincia|ARS': {fondo:'1822 Raices Ahorro Pesos - Clase A', texto:'el fondo de Provincia (1822 Raíces Ahorro Pesos)'},
  'icbc|ARS':      {fondo:'Alpha Pesos - Clase A', texto:'el fondo de ICBC (Alpha Pesos)'},
  'nacion|ARS':    {fondo:'Pellegrini Liquidez Pesos Clase A', texto:'el fondo de Nación (Pellegrini Liquidez Pesos)'},
  // Exchanges y billeteras cripto: publican su rendimiento anual
  'fiwind|ARS':    {exchange:'fiwind', moneda:'ARS', texto:'lo que publica Fiwind'},
  'letsbit|ARS':   {exchange:'letsbit', moneda:'ARS', texto:"lo que publica Let'sBit"},
  'lemon|USDT':    {exchange:'lemoncash', moneda:'USDT', texto:'lo que publica Lemon'},
  'belo|USDT':     {exchange:'belo', moneda:'USDT', texto:'lo que publica Belo'},
  'ripio|USDT':    {exchange:'ripio', moneda:'USDT', texto:'lo que publica Ripio'},
  'fiwind|USDT':   {exchange:'fiwind', moneda:'USDT', texto:'lo que publica Fiwind'},
  'letsbit|USDT':  {exchange:'letsbit', moneda:'USDT', texto:"lo que publica Let'sBit"},
  'nexo|USDT':     {exchange:'nexo', moneda:'USDT', texto:'lo que publica Nexo'},
  'satoshi|USDT':  {exchange:'satoshitango', moneda:'USDT', texto:'lo que publica SatoshiTango'},
  'prex|USD':      {exchange:'prex', moneda:'USD', texto:'lo que publica Prex'},
  'astropay|USD':  {exchange:'astropay', moneda:'USD', texto:'lo que publica AstroPay'},
};
function fuenteTasa(b){ const m = marcaDe(b.marca, b.nombre); return m ? FUENTES_TASA[m.id+'|'+b.moneda] || null : null; }
function claveTasa(b){ const m = marcaDe(b.marca, b.nombre); return m ? m.id+'|'+b.moneda : ''; }
const apyATna = apy => 365*(Math.pow(1+apy/100, 1/365)-1)*100;
async function actualizarTasas(forzar=false){
  const billes = state.billeteras.filter(b=>fuenteTasa(b) && !b.tnaManual);
  if(!billes.length) return;
  state.tasas = state.tasas || {valores:{}, actualizado:null};
  const hace = state.tasas.actualizado ? Date.now()-state.tasas.actualizado : Infinity;
  if(!forzar && hace < 1000*60*60*6) { aplicarTasas(); return; } // los fondos publican una vez por día
  try{
    const base = 'https://api.argentinadatos.com/v1/finanzas/';
    const valores = {};
    const conFondo = billes.some(b=>fuenteTasa(b).fondo), conExchange = billes.some(b=>fuenteTasa(b).exchange);
    if(conFondo){
      const [u, p] = await Promise.all(['ultimo','penultimo'].map(x=>fetch(base+'fci/mercadoDinero/'+x,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject())));
      const ant = Object.fromEntries(p.map(f=>[f.fondo, f]));
      for(const [k,f] of Object.entries(FUENTES_TASA)){
        if(!f.fondo) continue;
        const a = u.find(x=>x.fondo===f.fondo), b = ant[f.fondo];
        const dias = a && b ? (new Date(a.fecha)-new Date(b.fecha))/864e5 : 0;
        if(dias>0 && a.vcp && b.vcp) valores[k] = Math.round((a.vcp/b.vcp-1)/dias*365*10000)/100;
      }
    }
    if(conExchange){
      const r = await fetch(base+'rendimientos',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());
      for(const [k,f] of Object.entries(FUENTES_TASA)){
        if(!f.exchange) continue;
        const e = r.find(x=>x.entidad===f.exchange), x = e && e.rendimientos.find(y=>y.moneda===f.moneda);
        if(x && x.apy>=0) valores[k] = Math.round(apyATna(x.apy)*100)/100;
      }
    }
    state.tasas = {valores:Object.assign(state.tasas.valores||{}, valores), actualizado:Date.now()};
    if(aplicarTasas() || forzar) renderSuave();
    save();
  }catch(e){ /* sin internet o la página no respondió: queda la última tasa */ }
}
// Copia la tasa automática a cada billetera (menos las que cargaste a mano). Devuelve true si algo cambió.
function aplicarTasas(){
  let cambio = false;
  for(const b of state.billeteras){
    if(b.tnaManual || !fuenteTasa(b)) continue;
    const v = state.tasas?.valores?.[claveTasa(b)];
    if(v!=null && v!==b.tna){ b.tna = v; cambio = true; }
  }
  if(cambio) save();
  return cambio;
}

// Busca la marca: primero la elegida a mano, si no, por el nombre
function marcaDe(id, texto){
  if(id) { const m = MARCAS.find(x=>x.id===id); if(m) return m; }
  const t = ' ' + String(texto||'').toLowerCase() + ' ';
  return MARCAS.find(m => m.buscar.some(p => p.length<=3 ? t.includes(' '+p+' ') : t.includes(p))) || null;
}
// Ícono cuadrado con color de la marca; si no hay marca, emoji según moneda
function iconoBilletera(b){
  const m = marcaDe(b.marca, b.nombre);
  if(m) return badge(m);
  if(/efectivo|cash/i.test(b.nombre) && b.moneda==='ARS') return `<div class="ico">${ic('billete')}</div>`;
  return `<div class="ico">${ic(iconoMoneda(b.moneda))}</div>`;
}
function badge(m, extra=''){
  const fs = m.ini.length>=4?11 : m.ini.length===3?13 : 16;
  return `<div class="ico marca" style="background:${m.bg};color:${m.fg};font-size:${fs}px;${extra}">${m.ini}</div>`;
}
// Mini tarjeta de crédito con el color del banco
function miniTarjeta(d){
  const m = marcaDe(d.marca, d.quien);
  const bg = m ? m.bg : '#3a4150';
  const fg = m ? m.fg : '#fff';
  return `<div class="mini-card" style="background:linear-gradient(135deg, ${bg}, ${oscurecer(bg)});color:${fg}">
    <span class="mc-banco">${m?m.ini:''}</span><span class="mc-chip"></span><span class="mc-red">${esc(({Mastercard:'Master'})[d.red]||d.red||'')}</span></div>`;
}
function oscurecer(hex){
  const n = parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*.6), g=Math.round(((n>>8)&255)*.6), b=Math.round((n&255)*.6);
  return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ---------- Rendimiento (TNA) ----------
function rendimiento(saldo, tna){
  if(!tna || saldo<=0) return null;
  return { dia: saldo*tna/100/365, mes: saldo*tna/100/12 };
}

// ----- Conversión entre monedas con la cotización del día -----
function desdePesos(pesos, moneda){
  if(pesos==null) return null;
  if(moneda==='ARS') return pesos;
  if(moneda==='USDT') return state.usdt.valor ? pesos/state.usdt.valor : null;
  return state.dolar.valor ? pesos/state.dolar.valor : null;
}
function convertir(monto, de, a){ return de===a ? monto : desdePesos(aPesos(monto,de), a); }
function nombreDolar(){ return TIPOS_DOLAR.find(t=>t.id===state.dolar.tipo)?.nombre || ''; }
// "≈ $ 24.000" para mostrar al lado de montos en dólares
function enPesosTxt(monto, moneda){
  if(moneda==='ARS') return '';
  const p = aPesos(monto, moneda);
  return p==null ? '' : `≈ ${plata(Math.round(p))}`;
}

// ----- Mensualidades -----
function iconoSuscripcion(s){
  const t = ' ' + String(s.nombre||'').toLowerCase() + ' ';
  const m = SERVICIOS.find(x => x.buscar.some(p => p.length<=3 ? t.includes(' '+p+' ') : t.includes(p))) || marcaDe('', s.nombre);
  return m ? badge(m) : `<div class="ico">${ic(/gym|gimnasio/i.test(s.nombre)?'gym':'repetir')}</div>`;
}
// Cada cuántos meses se paga (1 = todos los meses, 12 = una vez por año)
const FRECUENCIAS = [[1,'Mes'],[2,'2 meses'],[3,'3 meses'],[6,'6 meses'],[12,'Año']];
function cada(s){ return s.cada||1; }
function textoCada(s){ const n=cada(s); return n===1 ? 'por mes' : n===12 ? 'por año' : `cada ${n} meses`; }
function mesesEntre(a, b){ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12 + (bm-am); }
// Ya está pagada en el período actual (por ejemplo: la anual se pagó hace 3 meses)
function pagadaPeriodo(s){ return !!s.ultimoPago && mesesEntre(s.ultimoPago, mesActual()) < cada(s); }
// Le toca este mes: no está pagada todavía, o se pagó justo este mes
function venceEsteMes(s){ return !pagadaPeriodo(s) || s.ultimoPago===mesActual(); }
function proximoPago(s){ return s.ultimoPago ? moverMes(s.ultimoPago, cada(s)) : mesActual(); }
// Total de mensualidades pasado a pesos (si falta el dólar, muestra los dólares aparte)
function mensualEnPesos(){
  const ars = totalMensual('ARS'), usd = totalMensual('USD'), usdP = aPesos(usd,'USD');
  if(!usd) return {total:plata(Math.round(ars)), detalle:''};
  if(usdP==null) return {total:[ars?plata(Math.round(ars)):'', plata(usd,'USD')].filter(Boolean).join(' + '), detalle:''};
  return {total:plata(Math.round(ars+usdP)), detalle:`Incluye ${plata(usd,'USD')}`};
}
function totalMensual(moneda){ return state.suscripciones.filter(s=>s.moneda===moneda).reduce((a,s)=>a+s.monto/cada(s),0); }
// Lo que hay que pagar de mensualidades ESTE mes
function aPagarMensualidades(moneda){ return state.suscripciones.filter(s=>s.moneda===moneda && venceEsteMes(s)).reduce((a,s)=>a+s.monto,0); }
function nombreExchange(){ return EXCHANGES_USDT.find(e=>e.id===state.usdt.exchange)?.nombre || state.usdt.exchange; }
function iconoMoneda(m){ return m==='USD'?'dolar' : m==='USDT'?'usdt' : 'billetera'; }
function nombreMoneda(m){ return m==='USD'?'Dólares' : m==='USDT'?'USDT' : 'Pesos'; }
function hayUSDT(){ return state.billeteras.some(b=>b.moneda==='USDT') || state.inversiones.some(i=>i.moneda==='USDT'); }

// ----- Vencimientos conectados -----
// Cuántos días faltan para ese día del mes (si ya pasó, cuenta hasta el mes que viene)
function diasHasta(dia){ return ((dia||0) - new Date().getDate() + 31) % 31; }
// Mensualidades: primero las que faltan pagar, de la que vence antes a la que vence después
function ordenVence(a,b){
  const pa=pagadaPeriodo(a), pb=pagadaPeriodo(b);
  if(pa!==pb) return pa ? 1 : -1;
  const aa=mensualidadAtrasada(a), ab=mensualidadAtrasada(b);
  if(aa!==ab) return aa ? -1 : 1;   // las atrasadas van primero
  return diasHasta(a.dia) - diasHasta(b.dia);
}
// Le pone el sello de "Próximo" a lo primero que falta pagar de cada lista (sin contar las atrasadas)
function marcarProximos(){
  document.querySelectorAll('#main .linea').forEach(l=>{
    const p = [...l.querySelectorAll('.item')].find(i=>!i.querySelector('.pill') && !i.classList.contains('atrasada'));
    if(p) p.classList.add('proximo');
  });
  const c = [...document.querySelectorAll('#main .cuota')].find(x=>!x.querySelector('.pill') && !x.classList.contains('atrasada'));
  if(c) c.classList.add('proximo');
}
// ----- Cuotas terminadas -----
// Fecha en que se terminó de pagar. Las cargadas antes de esta función no la guardaban: se busca el último pago en los movimientos.
function fechaTerminada(d){
  if(d.terminada) return d.terminada;
  const pagos = state.movimientos.filter(m=>(m.categoria==='cuotas'||m.categoria==='otros_i') && String(m.nota||'').startsWith(d.descripcion+' (')).map(m=>m.fecha).sort();
  return pagos.length ? pagos[pagos.length-1] : null;
}
// En Cuotas no se listan las terminadas (para no cargar la pantalla): un aviso corto que lleva al mes en Gastos
function avisoTerminadas(lista){
  if(!lista.length) return '';
  const ultima = lista.map(fechaTerminada).filter(Boolean).sort().pop();
  return `<button class="aviso-term" onclick="${ultima?`mesVisto='${ultima.slice(0,7)}';`:''}irA('gastos')">
    ${ici('tilde')} Terminaste de pagar ${lista.length} compra${lista.length===1?'':'s'}.
    <span>Las ves en Gastos, en el mes en que las terminaste ›</span></button>`;
}

// ----- Atrasadas -----
// Cuándo se cargó algo (las nuevas lo guardan; las viejas lo sacan del código de su id, que tiene la fecha adentro)
function creadaEl(x){
  if(x.creada) return x.creada;
  const t = parseInt(String(x.id||'').slice(0,-5), 36);
  return (t>1e12 && t<4e12) ? t : 0;
}
// Fin del día de vencimiento de este mes
function venceEsteMesEl(dia){ const h=new Date(); return new Date(h.getFullYear(), h.getMonth(), dia, 23, 59, 59).getTime(); }
// ¿Ya se pagó (o cobró) la cuota de este mes?
function cuotaPagadaEsteMes(d){
  if(d.ultimoPago) return d.ultimoPago===mesActual();
  // Las cuotas de antes de la versión 14.1 no guardaban el mes: lo buscamos en los movimientos
  return state.movimientos.some(m=>m.fecha.startsWith(mesActual()) && m.categoria===(d.direccion==='debo'?'cuotas':'otros_i')
    && String(m.nota||'').startsWith(d.descripcion+' ('));
}
// Atrasada = ya pasó el día de vencimiento de este mes y no se pagó.
// Si la cargaste después de ese día, la primera vence recién el mes que viene.
function cuotaAtrasada(d){
  if(d.cuotasPagadas>=d.cuotasTotales || !d.diaVencimiento) return false;
  if(new Date().getDate() <= d.diaVencimiento || cuotaPagadaEsteMes(d)) return false;
  return creadaEl(d) < venceEsteMesEl(d.diaVencimiento);
}
function mensualidadAtrasada(su){
  if(!su.dia || pagadaPeriodo(su) || new Date().getDate() <= su.dia) return false;
  return creadaEl(su) < venceEsteMesEl(su.dia);
}
// Fecha y hora como en un ticket: "MIÉ 11/11 · 14:32"
function fechaHora(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  const dia = d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','').toUpperCase();
  return `${dia} ${p(d.getDate())}/${p(d.getMonth()+1)} · ${p(d.getHours())}<b>:</b>${p(d.getMinutes())}`;
}
setInterval(()=>{ const r=$('.hero .reloj'); if(r) r.innerHTML=fechaHora(); }, 10000);

// ----- Inicio / Resumen -----
function vInicio(){
  const u = state.usuario;
  const movMes = state.movimientos.filter(m=>m.fecha.startsWith(mesActual()));
  const gastosARS = movMes.filter(m=>m.tipo==='gasto' && monedaDe(m)==='ARS').reduce((a,m)=>a+m.monto,0);
  const gastosUSD = movMes.filter(m=>m.tipo==='gasto' && monedaDe(m)==='USD').reduce((a,m)=>a+m.monto,0);
  const ingresosARS = movMes.filter(m=>m.tipo==='ingreso' && monedaDe(m)==='ARS').reduce((a,m)=>a+m.monto,0);
  const usdEnPesos = aPesos(gastosUSD,'USD');
  const totalMesPesos = gastosARS + (usdEnPesos||0);

  // Cuotas que todavía debo (activas)
  const activas = state.deudas.filter(d=>d.direccion==='debo' && d.cuotasPagadas < d.cuotasTotales);
  const cuotasMesARS = activas.filter(d=>d.moneda==='ARS').reduce((a,d)=>a+d.montoCuota,0) + aPagarMensualidades('ARS');
  const cuotasMesUSD = activas.filter(d=>d.moneda==='USD').reduce((a,d)=>a+d.montoCuota,0) + aPagarMensualidades('USD');

  const cuotasMesUSDPesos = aPesos(cuotasMesUSD,'USD');

  // Total: todo lo que tenés en billeteras y efectivo, pasado a pesos
  let totalPesos = 0; const sinCotizar = [];
  for(const b of state.billeteras){
    const s = saldoBilletera(b), p = aPesos(s, b.moneda);
    if(p==null){ if(s) sinCotizar.push(plata(s,b.moneda)); } else totalPesos += p;
  }

  // Gastos por categoría (en pesos)
  const porCat = {};
  for(const m of movMes.filter(m=>m.tipo==='gasto')){
    const p = aPesos(m.monto, monedaDe(m)); if(p==null) continue;
    porCat[m.categoria] = (porCat[m.categoria]||0) + p;
  }
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  // Próximos vencimientos (ordenados por día del mes)
  const hoy = new Date().getDate();
  // Cuotas y mensualidades sin pagar este mes, juntas en una sola lista
  const proximos = [
    ...activas.map(d=>({atrasada:cuotaAtrasada(d), dia:d.diaVencimiento||0, monto:d.montoCuota, moneda:d.moneda, nombre:d.descripcion,
      ico: d.clase==='tarjeta'?miniTarjeta(d):`<div class="ico">${ic('personas')}</div>`, detalle:`Cuota ${d.cuotasPagadas+1} de ${d.cuotasTotales}`})),
    ...state.suscripciones.filter(su=>!pagadaPeriodo(su)).map(su=>({atrasada:mensualidadAtrasada(su), dia:su.dia||0, monto:su.monto, moneda:su.moneda, nombre:su.nombre,
      ico: iconoSuscripcion(su), detalle: cada(su)===1 ? 'Mensualidad' : `Se paga ${textoCada(su)}`})),
  ].sort((a,b)=>(b.atrasada-a.atrasada) || ((a.dia-hoy+31)%31)-((b.dia-hoy+31)%31)).slice(0,4);

  return `
    <div class="row" style="margin-top:6px">
      <div>
        <p class="sub" style="margin:0">${saludo()},</p>
        <h1 style="margin-top:0">${esc(u.nombre)} ${u.emoji}</h1>
      </div>
      <button class="avatar" onclick="irA('ajustes')">${u.emoji}</button>
    </div>

    <div class="card hero" style="margin-top:14px">
      <div class="label"><span>Tenés en total</span><span class="reloj">${fechaHora()}</span></div>
      <div class="big ${totalPesos<0?'neg':''}">${plata(Math.round(totalPesos))}</div>
      <div class="s">${sinCotizar.length ? '+ '+sinCotizar.join(' + ') : `Sumando ${state.billeteras.length} billetera${state.billeteras.length===1?'':'s'}, pasado a pesos`}</div>
    </div>

    <div class="grid2">
      <div class="card" onclick="irA('gastos')">
        <div class="label con-ico">${ici('recibo')} Gastaste este mes</div>
        <div class="mid">${plata(gastosARS)}</div>
        ${gastosUSD?`<div class="s">+ ${plata(gastosUSD,'USD')}</div>`:''}
        ${ingresosARS?`<div class="s">Entró <span class="pos">${plata(ingresosARS)}</span></div>`:''}
      </div>
      <div class="card" onclick="irA('cuotas')">
        <div class="label con-ico">${ici('tarjeta')} A pagar este mes</div>
        ${cuotasMesUSD && cuotasMesUSDPesos!=null

          : `<div class="mid">${plata(cuotasMesARS)}</div>${cuotasMesUSD?`<div class="s">+ ${plata(cuotasMesUSD,'USD')}</div>`:''}`}
      </div>
    </div>

    <h2>Billeteras</h2>
    <div class="card">
      ${state.billeteras.map(b=>{
        const s=saldoBilletera(b);
        const enPesos = b.moneda==='USDT' ? aPesos(s,'USDT') : null;
        const r = rendimiento(s, b.tna);
        return `<div class="item" onclick="formBilletera('${b.id}')">
          ${iconoBilletera(b)}
          <div class="grow"><div class="t">${esc(b.nombre)}</div><div class="s">${nombreMoneda(b.moneda)}${b.tna?` · ${String(b.tna).replace('.',',')}% TNA`:''}</div>
            ${r?`<div class="rinde">Rinde ≈ ${plata(r.dia,b.moneda)} por día</div><div class="rinde">≈ ${plata(Math.round(r.mes),b.moneda)} por mes</div>`:''}</div>
          <div style="text-align:right"><div class="amt ${s<0?'neg':''}">${plata(s,b.moneda)}</div>
            ${enPesos!=null?`<div class="s">≈ ${plata(Math.round(enPesos))}</div>`:''}</div></div>`;

    <h2>Próximos vencimientos</h2>
    <div class="card linea">
      ${proximos.map(p=>`
        <div class="item${p.atrasada?' atrasada':''}" onclick="irA('cuotas')">

// ----- Gráfico: gastos de los últimos 6 meses -----
// Colores pensados para que se distingan bien entre sí (también para daltónicos)
let desgloseMes = null; // el mes que tocaste en el gráfico (null = ninguno abierto)

function gastosPorCategoria(ym){
  const porCat = {};
  for(const m of state.movimientos){
    if(m.tipo!=='gasto' || !m.fecha.startsWith(ym)) continue;
    const p = aPesos(m.monto, monedaDe(m)); if(p==null) continue;
    porCat[m.categoria] = (porCat[m.categoria]||0) + p;
  }
  return porCat;
}
// "$ 350 mil", "$ 1,2 M": para que entren los números arriba de las barras
function plataCorta(n){
  if(n>=1e6) return '$ ' + (n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1}) + ' M';
  if(n>=1e3) return '$ ' + Math.round(n/1e3) + ' mil';
  return '$ ' + Math.round(n);
}
function tocarMes(ym){
  desgloseMes = desgloseMes===ym ? null : ym;
  mesVisto = ym;
  render();
}
function graficoMeses(){
  const meses = [...Array(6)].map((_,i)=>moverMes(mesActual(), i-5));
  const datos = meses.map(ym=>{ const cats=gastosPorCategoria(ym); return {ym, cats, total:Object.values(cats).reduce((a,b)=>a+b,0)}; });
  if(!datos.some(d=>d.total)) return '';

  // Cada categoría tiene SIEMPRE el mismo color: las 7 donde más gastaste en estos meses tienen color propio, el resto va en gris
  const sumas = {};
  datos.forEach(d=>Object.entries(d.cats).forEach(([k,v])=>sumas[k]=(sumas[k]||0)+v));
  const orden = Object.entries(sumas).sort((a,b)=>b[1]-a[1]).map(x=>x[0]); // las más grandes abajo en la barra
  const colorDe = id => colorCat(id);

  const ALTO = 120; // alto máximo de una barra, en píxeles
  const max = Math.max(...datos.map(d=>d.total));
  const abierto = datos.find(d=>d.ym===desgloseMes);

  const barra = d => {
    const alto = Math.max(2, Math.round(d.total/max*ALTO));
    if(d!==abierto || !d.total) return `<div class="graf-barra ${d.ym===mesActual()?'actual':''}" style="height:${alto}px"><i style="flex:1"></i></div>`;
    // Barra abierta: un pedazo por categoría (abajo las más grandes) y el resto junto en gris
    const pedazos = orden.filter(id=>d.cats[id]).map(id=>({v:d.cats[id], color:colorDe(id)}));
    return `<div class="graf-barra" style="height:${alto}px">${pedazos.map(p=>`<i style="flex:${p.v} 1 0;min-height:2px;background:${p.color}"></i>`).join('')}</div>`;
  };

  const leyenda = abierto && abierto.total ? `
    <div class="label" style="margin-top:16px">En qué se fue la plata en ${nombreMes(abierto.ym)}</div>
    <div class="leyenda">${Object.entries(abierto.cats).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{ const c=categoria(id);
      return `<div class="row"><span><i class="punto" style="background:${colorDe(id)}"></i>${ici(c.ic)} ${c.nombre}</span>
        <span><b>${plata(Math.round(v))}</b> <span class="s">${Math.round(v/abierto.total*100)}%</span></span></div>`;}).join('')}</div>`
    : `<p class="s" style="text-align:center;margin:12px 0 0">Tocá un mes para ver en qué se fue la plata.</p>`;

  return `<div class="card">
    <div class="label">Gastos de los últimos 6 meses (en pesos)</div>
    <div class="graf">
      ${datos.map(d=>`<button class="graf-col ${d===abierto?'on':''}" onclick="tocarMes('${d.ym}')" aria-label="${nombreMes(d.ym)}: ${plata(Math.round(d.total))}">
        <span class="graf-val">${d.total?plataCorta(d.total):''}</span>
        ${barra(d)}
        <span class="graf-mes">${nombreMes(d.ym).slice(0,3)}</span>
      </button>`).join('')}
    </div>
    ${leyenda}
  </div>`;
}

// ----- Gastos -----
// "Gastaste 12% más que en Octubre": rojo si gastaste más, verde si gastaste menos
function comparacionMes(ym){
  const total = m => Object.values(gastosPorCategoria(m)).reduce((a,b)=>a+b,0);
  const ahora = total(ym), antes = total(moverMes(ym,-1));
  if(!antes || !ahora) return '';
  const dif = (ahora-antes)/antes*100, mas = dif>0, mesAnt = nombreMes(moverMes(ym,-1)).split(' ')[0];
  if(Math.abs(dif)<1) return `<div class="compara">Igual que en ${mesAnt}</div>`;
  return `<div class="compara ${mas?'sube':'baja'}"><b>${mas?'↑':'↓'} ${Math.abs(dif).toFixed(0)}%</b> ${mas?'más':'menos'} que en ${mesAnt}</div>`;
}
// ----- Meses: cuánto gastaste, cuánto entró y cuánto quedó cada mes (todo pasado a pesos) -----
function resumenMeses(){
  const porMes = {};
  for(const m of state.movimientos){
    const ym = m.fecha.slice(0,7), p = aPesos(m.monto, monedaDe(m)); if(p==null) continue;
    const x = porMes[ym] ||= {gastos:0, ingresos:0};
    if(m.tipo==='gasto') x.gastos += p; else x.ingresos += p;
  }
  return porMes;
}
const conSigno = n => (n>0?'+':n<0?'−':'')+plata(Math.round(Math.abs(n)));
// Cuotas que se terminaron de pagar en ese mes
function terminadasDelMes(ym){ return state.deudas.filter(d=>d.cuotasPagadas>=d.cuotasTotales && (fechaTerminada(d)||'').startsWith(ym)); }
// Resumen corto de los últimos meses en Gastos: 3 meses, y si querés ver más, se despliegan todos
let verTodosMeses = false;
function resumenUltimosMeses(){
  const porMes = resumenMeses(); porMes[mesActual()] ||= {gastos:0, ingresos:0};
  const meses = Object.keys(porMes).filter(ym=>ym<=mesActual()).sort().reverse();
  if(meses.length<2) return '';
  const visibles = verTodosMeses ? meses : meses.slice(0,3);
  return `
    <div class="card meses">
      <div class="mes-fila mes-tit"><span>Mes</span><span>Gastaste</span><span>Te quedó</span></div>
      ${visibles.map(ym=>{ const x=porMes[ym], q=x.ingresos-x.gastos;
        return `<button class="mes-fila${ym===mesVisto?' en-uso':''}" onclick="mesVisto='${ym}';renderSuave()">
          <span>${nombreMes(ym)}</span><span>${plata(Math.round(x.gastos))}</span>
          <span class="${x.ingresos?(q>=0?'pos':'neg'):''}">${x.ingresos?conSigno(q):'—'}</span></button>`; }).join('')}
      ${meses.length>3?`<button class="ver-mas" onclick="verTodosMeses=!verTodosMeses;renderSuave()">${verTodosMeses?'Ver menos':`Ver ${meses.length-3} meses más`} ${ic('flecha-abajo')}</button>`:''}
    </div>`;
}

      ${(()=>{ const t=terminadasDelMes(mesVisto); if(!t.length) return '';

          ${t.map(d=>`<div class="mes-term-fila"><span>${ici('tilde')}${esc(d.descripcion)}</span><b>${plata(d.cuotasTotales*d.montoCuota,d.moneda)}</b></div>`).join('')}

    </div>

      <div class="card" style="padding:4px 16px">
        ${movs.map(m=>{ const c=categoria(m.categoria), b=billetera(m.billeteraId);
          return `<div class="item" onclick="formMovimiento('${m.id}')">
            ${icoCat(m.categoria)}
            <div class="grow"><div class="t">${esc(m.nota||c.nombre)}</div><div class="s">${c.nombre} · ${esc(b?b.nombre:'—')}${m.dividido?` · entre ${m.dividido}`:''}</div></div>
            <div class="amt ${m.tipo==='ingreso'?'pos':''}">${m.tipo==='ingreso'?'+':'-'}${plata(m.monto,monedaDe(m))}</div></div>`;
        }).join('')}
      </div>`).join('') : `<div class="card empty">No hay movimientos este mes</div>`}
`;
}

// Hoja de pago compartida por cuotas y mensualidades.
// Siempre registra el movimiento (así se descuenta de la billetera) con la fecha de hoy.
// otraPersona = true: muestra la opción "La pagó otra persona" (no sale de ninguna billetera; si hay que devolverla, se anota como deuda)
function hojaPago({titulo, detalle, monto, moneda, preferida, pregunta, alConfirmar, otraPersona=false}){
  // Primero las billeteras de la misma moneda
  const billes = [...state.billeteras].sort((a,b)=>(b.moneda===moneda)-(a.moneda===moneda));
  const elegida = billes.find(b=>b.id===preferida && b.moneda===moneda) || billes[0];
  abrirSheet(`
    <h3>${titulo}</h3>
    <p class="sub" style="margin-bottom:2px">${detalle}</p>
    <div class="mid">${plata(monto,moneda)}</div>
    ${moneda!=='ARS'&&aPesos(monto,moneda)!=null?`<div class="s">${enPesosTxt(monto,moneda)} al dólar ${nombreDolar()} de hoy</div>`:''}
    <div id="pagoConBille">
      <label>${pregunta}</label>
      ${chipsBilleteras('pagoBille', elegida?.id, billes)}
      <div class="conv" id="pagoConv"></div>
    </div>
    ${otraPersona?`
    <button type="button" class="btn sec sm otra-op" id="pagoOtra">${ici('personas')} La pagó otra persona</button>
    <div id="pagoOtraCaja" hidden>
      <label>¿Quién la pagó?</label>
      <input id="pagoQuien" placeholder="Ej: Mamá" maxlength="30" value="${esc(state.ultimoPagador||'')}">
      <label>¿Se lo tenés que devolver?</label>
      <div class="seg" id="pagoDevolver"><button type="button" data-v="no" class="on">No</button><button type="button" data-v="si">Sí, se lo devuelvo</button></div>
      <p class="conv" id="pagoOtraTxt"></p>
    </div>`:''}
    <div class="actions"><button class="btn" id="pagoOk">Confirmar</button></div>`);
  let otra = false, devolver = false;
  const textoOtra = () => { if(!otraPersona) return;
    const q = esc($('#pagoQuien').value.trim()||'esa persona');
    $('#pagoOtraTxt').innerHTML = `No se descuenta de ninguna billetera.<br>${devolver?`Se anota en «Lo que debo» que le debés ${plata(monto,moneda)} a ${q}.`:'Queda pagada y listo.'}`;
  };
  if(otraPersona){
    $('#pagoOtra').onclick = () => {
      otra = !otra;
      $('#pagoOtraCaja').hidden = !otra; $('#pagoConBille').hidden = otra;
      $('#pagoOtra').innerHTML = otra ? `${ici('billetera')} Mejor la pago yo` : `${ici('personas')} La pagó otra persona`;
      if(otra && !$('#pagoQuien').value) $('#pagoQuien').focus();
      textoOtra();
    };
    $('#pagoQuien').addEventListener('input', textoOtra);
    document.querySelectorAll('#pagoDevolver button').forEach(x=>x.onclick=()=>{
      devolver = x.dataset.v==='si';
      document.querySelectorAll('#pagoDevolver button').forEach(y=>y.classList.toggle('on', y===x));
      textoOtra();
    });
  }
  const montoEn = id => { const b=billetera(id); return b ? convertir(monto, moneda, b.moneda) : null; };
  const mostrar = () => {
    const b = billetera($('#pagoBille').dataset.v); if(!b) return;
    const m = montoEn(b.id);
    $('#pagoConv').innerHTML = b.moneda===moneda ? `Se descuenta ${plata(monto,moneda)} de ${esc(b.nombre)}.`
      : m==null ? `Falta la cotización para pasar a ${nombreMoneda(b.moneda).toLowerCase()}. Actualizala en Ajustes.`
      : `Se descuentan <b style="color:var(--txt)">${plata(Math.round(m*100)/100,b.moneda)}</b> de ${esc(b.nombre)}.`;
  };
  $('#pagoBille').addEventListener('cambio', mostrar); mostrar();
  $('#pagoOk').onclick = () => {
    if(otra){
      const quien = $('#pagoQuien').value.trim(); if(!quien) return toast('Poné quién la pagó');
      state.ultimoPagador = quien;
      return alConfirmar(null, monto, {quien, devolver});
    }
    const b = billetera($('#pagoBille').dataset.v); if(!b) return toast('Elegí una billetera');
    const m = montoEn(b.id); if(m==null) return toast('Falta la cotización del dólar');
    alConfirmar(b, Math.round(m*100)/100);
  };
}

// Si alguien pagó algo tuyo y se lo tenés que devolver: queda en "Lo que debo" como deuda con esa persona
function anotarDevolucion(quien, descripcion, monto, moneda){
  state.deudas.push({id:uid(), creada:Date.now(), clase:'persona', direccion:'debo', descripcion, quien, moneda,
    montoCuota:monto, cuotasTotales:1, cuotasPagadas:0, diaVencimiento:0, red:'', marca:''});
}

function pagarCuota(id){
  const d = state.deudas.find(x=>x.id===id); if(!d) return;
  const debo = d.direccion==='debo';
  hojaPago({
    titulo: `${debo?'Pagar cuota':'Registrar cobro'} ${d.cuotasPagadas+1}/${d.cuotasTotales}`,
    detalle: esc(d.descripcion), monto: d.montoCuota, moneda: d.moneda,
    pregunta: debo ? '¿De qué billetera sale?' : '¿A qué billetera entra?',
    otraPersona: debo,
    alConfirmar: (b, monto, otra) => {
      d.cuotasPagadas = Math.min(d.cuotasTotales, d.cuotasPagadas+1);
      d.ultimoPago = mesActual();
      if(d.cuotasPagadas>=d.cuotasTotales) d.terminada = hoyISO(); // queda en el historial de terminadas
      if(!b){ // La pagó otra persona: no sale de ninguna billetera
        if(otra.devolver) anotarDevolucion(otra.quien, `${d.descripcion} (cuota ${d.cuotasPagadas}/${d.cuotasTotales})`, monto, d.moneda);
        save(); cerrarSheet(); render();
        return toast(otra.devolver ? `Cuota registrada · le debés a ${otra.quien}` : `Cuota registrada · la pagó ${otra.quien}`);
      }
      const conv = b.moneda!==d.moneda ? ` · ${plata(d.montoCuota,d.moneda)}` : '';
      state.movimientos.push({id:uid(), tipo: debo?'gasto':'ingreso', monto, billeteraId:b.id,
        categoria: debo?'cuotas':'otros_i', fecha:hoyISO(), nota:`${d.descripcion} (${d.cuotasPagadas}/${d.cuotasTotales})${conv}`});
      save(); cerrarSheet(); render();
      toast(d.cuotasPagadas>=d.cuotasTotales ? '¡Terminaste de pagarla!' : 'Cuota registrada');
    }
  });
}

// Ícono y color para cada tipo de inversión
const TIPO_INV = {
  'Plazo fijo':['billetera','#3f8ee6'], 'FCI':['grafico','#17a57a'], 'Dólares':['dolar','#2f9e44'], 'Cripto':['usdt','#d9a400'],
  'Acciones/CEDEARs':['grafico','#7b6be0'], 'Bonos':['recibo','#d5568a'], 'Otro':['otros','#9a8a78'],
};
function tipoInv(t){ return TIPO_INV[t] || TIPO_INV.Otro; }
function vInversiones(){
  const l = state.inversiones;
  // Todo pasado a pesos para poder sumarlo y compararlo
  let puse=0, vale=0; const porTipo={}, sinCotizar=[];
  for(const i of l){
    const pi=aPesos(i.invertido,i.moneda), pa=aPesos(i.valorActual,i.moneda);
    if(pi==null||pa==null){ sinCotizar.push(i); continue; }
    puse+=pi; vale+=pa; porTipo[i.tipo]=(porTipo[i.tipo]||0)+pa;
  }
  const g = vale-puse, gp = puse ? g/puse*100 : 0;
  const tipos = Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
  const gan = (inv,act) => { const d=act-inv, p=inv?d/inv*100:0; return `<span class="gan ${d>=0?'pos':'neg'}">${d>=0?'↑ +':'↓ '}${p.toFixed(1)}%</span>`; };

  return `
    <h1>Inversiones</h1>
    <p class="sub">Cuánto pusiste y cuánto vale hoy.</p>
    ${l.length ? `
    <div class="card hero">
      <div class="label">Tus inversiones valen hoy</div>
      <div class="big">${plata(Math.round(vale))}</div>
      <div class="s">Pusiste ${plata(Math.round(puse))}</div>
      ${puse?`<div class="compara ${g>=0?'baja':'sube'}"><b>${g>=0?'↑ +':'↓ −'}${plata(Math.abs(Math.round(g)))}</b> · ${g>=0?'+':''}${gp.toFixed(1)}% ${g>=0?'de ganancia':'de pérdida'}</div>`:''}
      ${tipos.length>1 ? `<div class="reparto">${tipos.map(([t,v])=>`<i style="flex:${v};background:${tipoInv(t)[1]}"></i>`).join('')}</div>
        <div class="reparto-ley">${tipos.map(([t,v])=>`<span><i class="punto" style="background:${tipoInv(t)[1]}"></i>${esc(t)} ${Math.round(v/vale*100)}%</span>`).join('')}</div>`:''}
      ${sinCotizar.length?`<div class="s" style="margin-top:8px">Faltan cotizaciones para sumar ${sinCotizar.length} inversión${sinCotizar.length>1?'es':''}.</div>`:''}
    </div>` : ''}
    <div class="card" style="padding:4px 16px">
      ${l.map(i=>{ const [icn,col]=tipoInv(i.tipo); const enP=i.moneda!=='ARS'?enPesosTxt(i.valorActual,i.moneda):'';
        return `<div class="item" onclick="formInversion('${i.id}')">
          <div class="ico cat" style="--c:${col}">${ic(icn)}</div>
          <div class="grow"><div class="t">${esc(i.nombre)}</div><div class="s">${esc(i.tipo)}</div><div class="s">Pusiste ${plata(i.invertido,i.moneda)}</div></div>
          <div style="text-align:right"><div class="amt">${plata(i.valorActual,i.moneda)}</div>${enP?`<div class="s">${enP}</div>`:''}${gan(i.invertido,i.valorActual)}</div>
        </div>`;}).join('') || `<div class="empty">Todavía no cargaste inversiones.<br>Tocá el botón + para agregar la primera.</div>`}
    </div>
    ${l.length?`<p class="s" style="text-align:center">Tocá una inversión para actualizar cuánto vale.</p>`:''}`;
}

      state=Object.assign(estadoVacio(),data); save(); render(); toast('Respaldo restaurado');

// Mientras la hoja está abierta, la pantalla de atrás queda "congelada" para que no se mueva al deslizar
function bloquearFondo(){
  if(document.body.dataset.bloqueado) return;
  const y = window.scrollY;
  document.body.dataset.bloqueado = y;
  Object.assign(document.body.style, {position:'fixed', top:`-${y}px`, left:'0', right:'0'});
}
function desbloquearFondo(){
  if(!document.body.dataset.bloqueado) return;
  const y = Number(document.body.dataset.bloqueado);
  delete document.body.dataset.bloqueado;
  Object.assign(document.body.style, {position:'', top:'', left:'', right:''});
  window.scrollTo(0, y);
}
