<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<style>
  /* ============================================================
     DISEÑO "TICKET DEL SÚPER"
     Todos los colores están en variables: el modo noche solo cambia estos valores.
     ============================================================ */
  @font-face{font-family:'Space Mono';font-weight:400;font-display:swap;src:url(fonts/SpaceMono-400.woff2) format('woff2')}
  @font-face{font-family:'Space Mono';font-weight:700;font-display:swap;src:url(fonts/SpaceMono-700.woff2) format('woff2')}
  @font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url(fonts/SpaceGrotesk.woff2) format('woff2')}

  /* ☀️ Modo día: papel de ticket + sello azul */
  :root{
    --bg:#e6e3dc;          /* el mostrador */
    --card:#fffefa;        /* el papel del ticket */
    --card2:#f1eee6;       /* papel un poco más gris (campos, chips) */
    --line:#d6d1c5;        /* líneas */
    --punteo:#b9b3a4;      /* líneas punteadas */
    --txt:#161616;         /* tinta */
    --muted:#615e57;       /* tinta gastada */
    --accent:#2340d9;      /* el sello */
    --accent-fondo:#2340d9;/* fondo de botones (en modo noche es metálico) */
    --accent-txt:#ffffff;
    --red:#c62828; --green:#23784a;
    --nav-bg:rgba(255,254,250,.94);
    --graf:#d6d1c5;
    --sombra:0 1px 0 #cfc9bb;
    --overlay:rgba(22,22,22,.45);
    --barra-sup:#161616;
    --r:3px;
    color-scheme:light;
  }
  /* 🌙 Modo noche: grafito con sello rojo cereza.
     Ojo: acá lo negativo/lo que debés va en naranja para no confundirse con los botones rojos. */
  :root[data-tema="oscuro"]{
    --bg:#0e0e10; --card:#18181b; --card2:#232327; --line:#313136; --punteo:#45454c;
    --txt:#f4f4f5; --muted:#a1a1aa;
    --accent:#ff3b5c;
    --accent-fondo:linear-gradient(135deg,#e8264c 0%,#d9143c 55%,#b80d31 100%);
    --accent-txt:#ffffff;
    --red:#ffa04d; --green:#6fdca5;
    --nav-bg:rgba(14,14,16,.94);
    --graf:#313136;
    --sombra:0 1px 0 #000;
    --overlay:rgba(0,0,0,.6);
    --barra-sup:#0e0e10;
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
    font-size:15px;-webkit-font-smoothing:antialiased}
  /* Franja de arriba (donde está la hora del celu): oscura, como la boca de la impresora del ticket */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--barra-sup);z-index:40}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  h1,h2,h3,nav button,.btn,.seg button{font-family:'Space Grotesk',system-ui,sans-serif}
  h1{font-size:25px;margin:8px 0 2px;letter-spacing:1px;text-transform:uppercase}
  h2{font-size:15px;margin:24px 0 10px;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--txt);padding-bottom:6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--sombra)}
  /* Recuadro principal: franja de sello arriba y borde de ticket cortado abajo */
  .hero{border-top:6px solid var(--accent);padding-bottom:24px;
    -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/14px 100% repeat-x;
            mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/14px 100% repeat-x}
  .big{font-size:31px;font-weight:700;letter-spacing:-1px}
  .label{color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 .card{margin:0}
  .mid{font-size:19px;font-weight:700;letter-spacing:-.5px}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--punteo)}
  .item:last-child{border-bottom:0}
  .ico{width:40px;height:40px;border-radius:4px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
  .grow{flex:1;min-width:0}
  .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s{color:var(--muted);font-size:12px;margin-top:2px}
  .amt{font-weight:700;white-space:nowrap}
  .neg{color:var(--red)} .pos{color:var(--green)}
  /* "Pagado": como un sello estampado, un poco torcido */
  .pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:3px;border:1.5px solid var(--accent);color:var(--accent);
    text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:transparent;transform:rotate(-4deg)}
  .empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}
  .bar{height:8px;background:var(--card2);border-radius:0;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--accent-fondo)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700;border-radius:4px;padding:14px;width:100%;font-size:15px;text-transform:uppercase;letter-spacing:1px}
  .btn.sec{background:var(--card2);color:var(--txt)}
  .btn.danger{background:transparent;color:var(--red);border:1.5px dashed var(--red)}
  .btn.sm{width:auto;padding:8px 12px;font-size:13px;white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 12px;border-radius:4px;background:var(--card2);font-size:13px}
  .chip.on{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700}
  .monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:12px}
  .monthnav button{width:40px;height:40px;border-radius:4px;font-size:20px}
  /* barra de abajo */
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1.5px dashed var(--txt);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 6px;min-width:58px}
  nav button span{font-size:22px;filter:grayscale(1);opacity:.7}
  nav button.on{color:var(--accent);font-weight:700} nav button.on span{filter:none;opacity:1}
  .fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:6px;
    background:var(--accent-fondo);color:var(--accent-txt);box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:11;display:grid;place-items:center;padding:0;
    transition:transform .25s,opacity .25s}
  .fab.escondido{transform:translateY(24px) scale(.6);opacity:0;pointer-events:none}
  /* hoja que sube desde abajo */
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:10px 10px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(60px)}to{transform:none}}
  .sheet h3{margin:4px 0 14px;font-size:19px;text-transform:uppercase;letter-spacing:1px;padding-right:44px}
  .handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
  .cerrar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:4px;background:var(--card2);color:var(--muted);display:grid;place-items:center;padding:0}
  label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:4px;
    padding:13px 12px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{border-color:var(--accent)}
  .seg{display:flex;background:var(--card2);border-radius:4px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border-radius:3px;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--accent-fondo);color:var(--accent-txt);font-weight:700}
  .actions{display:grid;gap:10px;margin-top:18px}
  .welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .welcome .emoji{font-size:64px}
  .emojis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .emojis button{font-size:28px;width:52px;height:52px;border-radius:4px;background:var(--card2)}
  .emojis button.on{outline:2px solid var(--accent)}
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);border:1.5px dashed var(--txt);
    padding:10px 16px;border-radius:4px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  /* íconos de bancos y billeteras */
  .ico.marca{font-weight:700;letter-spacing:-.5px;font-family:'Space Grotesk',system-ui,sans-serif}
  .marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:220px;overflow:auto;padding:2px}
  .marca-op{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:4px;background:var(--card2);font-size:10px;color:var(--muted)}
  .marca-op span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .marca-op.on{outline:2px solid var(--accent);color:var(--txt)}
  .mini-card{position:relative;width:56px;height:38px;border-radius:5px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25);overflow:hidden;font-family:'Space Grotesk',sans-serif}
  .mc-banco{position:absolute;left:5px;top:3px;font-size:9px;font-weight:700}
  .mc-chip{position:absolute;left:6px;top:16px;width:10px;height:8px;border-radius:2px;background:linear-gradient(135deg,#f6d77a,#c9a240)}
  .mc-red{position:absolute;right:5px;bottom:3px;font-size:8px;font-weight:700;font-style:italic;text-transform:uppercase;opacity:.95}
  .rinde{color:var(--green);font-size:11px;margin-top:2px}
  /* gráfico de meses */
  .graf{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:22px}
  .graf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .graf-val{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;letter-spacing:-.5px}
  .graf-col.on .graf-val{color:var(--txt);font-weight:700}
  .graf-barra{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;gap:2px;overflow:hidden;min-height:2px}
  .graf-barra i{display:block;width:100%;background:var(--graf)}
  .graf-col.on .graf-barra i{background:var(--accent-fondo)}
  .graf-mes{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1.5px solid var(--txt);width:100%;text-align:center}
  .graf-col.on .graf-mes{color:var(--txt);font-weight:700}
  .leyenda{display:grid;gap:8px;margin-top:14px;font-size:14px}
  .leyenda .row span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
  .punto{width:10px;height:10px;border-radius:2px;flex:none}
  /* elegir billetera */
  .billes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
  .bille-op{flex:none;width:100px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:4px;background:var(--card2);font-size:12px}
  .bille-op span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .bille-op small{color:var(--muted);font-size:10px;white-space:nowrap}
  .bille-op.on{outline:2px solid var(--accent)}
  .conv{color:var(--muted);font-size:12px;margin-top:8px}
  /* logo */
  .logo text{font-family:'Space Grotesk',system-ui,sans-serif}
  .logo-bienvenida{width:190px;height:190px;margin:0 auto 6px}
  .logo-bienvenida svg,.pie svg{width:100%;height:100%;display:block}
  .pie{text-align:center;margin:28px 0 20px}.pie svg{width:110px;height:110px;margin:0 auto 6px}
  .avatar{width:44px;height:44px;border-radius:4px;background:var(--card2);display:grid;place-items:center;font-size:24px}
</style>
</head>
<body>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Agregar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Mis Finanzas — app personal (PWA)
   Todo se guarda en el teléfono (localStorage). Nada se sube a internet.
   ============================================================ */

const STORAGE_KEY = 'finanzas-v1';
const VERSION_APP = 9; // subilo junto con el de sw.js, así sabés en Ajustes qué versión tenés

// Logo "Cuentas claras": usa los colores del modo actual (azul de día, cereza de noche)
function logoSello(u='l', A='var(--txt)', B='var(--accent)', P='var(--bg)'){
  return `<svg xmlns="http://www.w3.org/2000/svg" class="logo" viewBox="0 0 256 256"><g transform="rotate(-8 128 128)"><circle cx="128" cy="128" r="118" fill="none" stroke="${B}" stroke-width="10"/><defs><path id="arr-${u}" d="M40 128 A88 88 0 0 1 216 128"/><path id="aba-${u}" d="M30 128 A98 98 0 0 0 226 128"/></defs>
<text font-family="Space Grotesk" font-weight="700" font-size="24" letter-spacing="3" fill="${B}"><textPath href="#arr-${u}" startOffset="50%" text-anchor="middle">CUENTAS CLARAS</textPath></text>
<text font-family="Space Grotesk" font-weight="500" font-size="15" letter-spacing="2" fill="${B}"><textPath href="#aba-${u}" startOffset="50%" text-anchor="middle">CONSERVAN LA AMISTAD</textPath></text>
<g fill="${B}"><circle cx="37" cy="128" r="5"/><circle cx="219" cy="128" r="5"/></g>
<circle cx="128" cy="128" r="80" fill="none" stroke="${B}" stroke-width="4"/><defs><clipPath id="rec-${u}"><circle cx="128" cy="128" r="75"/></clipPath></defs>
<g clip-path="url(#rec-${u})"><g transform="translate(48 42) scale(0.66)"><path d="M104 330 V184 Q104 126 158 126 Q212 126 212 184 V330 H104 Z" fill="${B}"/>
<circle cx="150" cy="82" r="30" fill="${B}"/>
<path d="M44 330 V184 Q44 126 98 126 Q152 126 152 184 V330 H44 Z" fill="${A}" stroke="${P}" stroke-width="9" paint-order="stroke"/>
<circle cx="104" cy="82" r="30" fill="${A}" stroke="${P}" stroke-width="8" paint-order="stroke"/>
<path d="M122 184 Q164 146 206 160" fill="none" stroke="${P}" stroke-width="33" stroke-linecap="round"/>
<path d="M122 184 Q164 146 206 160" fill="none" stroke="${A}" stroke-width="20" stroke-linecap="round"/>
<circle cx="47" cy="158" r="16" fill="${B}" stroke="${P}" stroke-width="7" paint-order="stroke"/></g></g></g></svg>`;
}


// ---------- Datos fijos ----------
const CATEGORIAS = [
  {id:'comida',     nombre:'Comida',      emoji:'🍔'},
  {id:'super',      nombre:'Súper',       emoji:'🛒'},
  {id:'transporte', nombre:'Transporte',  emoji:'🚌'},
  {id:'salidas',    nombre:'Salidas',     emoji:'🍻'},
  {id:'servicios',  nombre:'Servicios',   emoji:'💡'},
  {id:'facu',       nombre:'Facultad',    emoji:'📚'},
  {id:'gym',        nombre:'Gimnasio',    emoji:'🏋️'},
  {id:'ropa',       nombre:'Ropa',        emoji:'👕'},
  {id:'salud',      nombre:'Salud',       emoji:'💊'},
  {id:'subs',       nombre:'Suscripciones', emoji:'📺'},
  {id:'cuotas',     nombre:'Cuotas',      emoji:'💳'},
  {id:'otros',      nombre:'Otros',       emoji:'📦'},
];
const CATEGORIAS_INGRESO = [
  {id:'laburo',  nombre:'Laburo',   emoji:'💼'},
  {id:'sueldo',  nombre:'Sueldo',   emoji:'💰'},
  {id:'changa',  nombre:'Changa',   emoji:'🛠️'},
  {id:'regalo',  nombre:'Regalo',   emoji:'🎁'},
  {id:'otros_i', nombre:'Otros',    emoji:'📥'},
];
const TIPOS_INVERSION = ['Plazo fijo','FCI','Dólares','Cripto','Acciones/CEDEARs','Bonos','Otro'];
const TIPOS_DOLAR = [
  {id:'blue',    nombre:'Blue'},
  {id:'bolsa',   nombre:'MEP'},
  {id:'oficial', nombre:'Oficial'},
  {id:'tarjeta', nombre:'Tarjeta'},
];
const EMOJIS_AVATAR = ['😎','🤑','🦊','🐸','🚀','🔥','🐱','👾','🦁','🍀'];

// ---------- Estado ----------
let state = loadState();
let vista = 'inicio';
let mesVisto = mesActual(); // "2026-11"

function estadoVacio(){
  return {
    usuario: null,                    // {nombre, emoji}
    billeteras: [],                   // {id, nombre, moneda:'ARS'|'USD', saldoInicial}
    movimientos: [],                  // {id, tipo:'gasto'|'ingreso', monto, billeteraId, categoria, fecha, nota}
    deudas: [],                       // {id, clase:'tarjeta'|'persona', direccion:'debo'|'medeben', descripcion, quien, moneda, montoCuota, cuotasTotales, cuotasPagadas, diaVencimiento}
    inversiones: [],                  // {id, nombre, tipo, moneda, invertido, valorActual, actualizado}
    suscripciones: [],                // mensualidades: {id, nombre, moneda, monto, dia, billeteraId, ultimoPago:'2026-11'}
    dolar: {tipo:'blue', valor:null, actualizado:null, manual:false},
    tema: 'auto',                     // 'auto' (como el celu) | 'claro' | 'oscuro'
    usdt:  {exchange:'lemoncash', valor:null, actualizado:null, manual:false}, // precio de VENTA de 1 USDT en pesos
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const datos = Object.assign(estadoVacio(), JSON.parse(raw));
      datos.usdt = Object.assign(estadoVacio().usdt, datos.usdt); // por si venís de la versión 1
      return datos;
    }
  }catch(e){}
  return estadoVacio();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ toast('⚠️ No se pudo guardar'); }
}

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function hoyISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function mesActual(){ return hoyISO().slice(0,7); }
function nombreMes(ym){
  const [y,m] = ym.split('-').map(Number);
  const mes = new Date(y, m-1, 1).toLocaleDateString('es-AR',{month:'long'});
  return mes.charAt(0).toUpperCase() + mes.slice(1) + ' ' + y;
}
function moverMes(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function plata(n, moneda='ARS'){
  const num = Number(n)||0;
  const txt = num.toLocaleString('es-AR',{minimumFractionDigits: (moneda!=='ARS' || !Number.isInteger(num))?2:0, maximumFractionDigits:2});
  if(moneda==='USDT') return txt + ' USDT';
  return (moneda==='USD' ? 'US$ ' : '$ ') + txt;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
// Entiende "1.500,50", "1500,5", "1500.5" y "1.500"
function num(v){
  let s = String(v??'').trim().replace(/[^\d.,-]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');          // coma = decimal
  else if(/\.\d{3}$/.test(s) && (s.match(/\./g)||[]).length>=1 && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g,''); // punto de miles
  return parseFloat(s) || 0;
}
function fechaCorta(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}`; }

function billetera(id){ return state.billeteras.find(b=>b.id===id); }
function monedaDe(mov){ const b=billetera(mov.billeteraId); return b ? b.moneda : (mov.moneda||'ARS'); }
function categoria(id){ return [...CATEGORIAS,...CATEGORIAS_INGRESO].find(c=>c.id===id) || {nombre:'Otros',emoji:'📦'}; }

// Convierte a pesos usando la cotización guardada (si no hay, devuelve null para USD)
function aPesos(monto, moneda){
  if(moneda==='ARS') return monto;
  if(moneda==='USDT') return state.usdt.valor ? monto * state.usdt.valor : null;
  if(!state.dolar.valor) return null;
  return monto * state.dolar.valor;
}

function saldoBilletera(b){
  let saldo = Number(b.saldoInicial)||0;
  for(const m of state.movimientos){
    if(m.billeteraId!==b.id) continue;
    saldo += m.tipo==='ingreso' ? m.monto : -m.monto;
  }
  return saldo;
}

function saludo(){
  const h = new Date().getHours();
  if(h<6)  return 'Buenas noches';
  if(h<13) return 'Buen día';
  if(h<20) return 'Buenas tardes';
  return 'Buenas noches';
}

// ---------- Cotización del dólar ----------
async function actualizarDolar(forzar=false){
  if(state.dolar.manual && !forzar) return;
  const hace = state.dolar.actualizado ? (Date.now()-state.dolar.actualizado) : Infinity;
  if(!forzar && hace < 1000*60*30) return; // cada 30 min como máximo
  try{
    const r = await fetch('https://dolarapi.com/v1/dolares/' + state.dolar.tipo, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    if(d && d.venta){
      state.dolar.valor = Number(d.venta);
      state.dolar.actualizado = Date.now();
      state.dolar.manual = false;
      save(); render();
      if(forzar) toast('💵 Dólar actualizado');
    }
  }catch(e){
    if(forzar) toast('Sin conexión: uso la última cotización');
  }
}

// ---------- Cotización del USDT (precio de VENTA en el exchange elegido) ----------
const EXCHANGES_USDT = [
  {id:'lemoncash', nombre:'Lemon'},
  {id:'belo',      nombre:'Belo'},
  {id:'buenbit',   nombre:'Buenbit'},
  {id:'ripio',     nombre:'Ripio'},
  {id:'fiwind',    nombre:'Fiwind'},
];
async function actualizarUSDT(forzar=false){
  if(state.usdt.manual && !forzar) return;
  const hace = state.usdt.actualizado ? (Date.now()-state.usdt.actualizado) : Infinity;
  if(!forzar && hace < 1000*60*10) return; // cada 10 min como máximo
  try{
    // CriptoYa devuelve {ask, totalAsk, bid, totalBid}. "bid" = a cuánto te lo compran = tu precio de VENTA
    // Usamos "bid" (el que muestra Lemon); "totalBid" le descuenta comisiones y da un poco menos
    const r = await fetch(`https://criptoya.com/api/${state.usdt.exchange}/usdt/ars/1`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    const venta = Number(d.bid || d.totalBid);
    if(venta > 0){
      state.usdt.valor = venta;
      state.usdt.actualizado = Date.now();
      state.usdt.manual = false;
      save(); render();
      if(forzar) toast('🪙 USDT actualizado');
    }
  }catch(e){
    if(forzar) toast('No pude traer el USDT: uso el último guardado');
  }
}

// Busca la marca: primero la elegida a mano, si no, por el nombre
function marcaDe(id, texto){
  if(id) { const m = MARCAS.find(x=>x.id===id); if(m) return m; }
  const t = ' ' + String(texto||'').toLowerCase() + ' ';
  return MARCAS.find(m => m.buscar.some(p => p.length<=3 ? t.includes(' '+p+' ') : t.includes(p))) || null;
}
// Ícono cuadrado con color de la marca; si no hay marca, emoji según moneda
function iconoBilletera(b){
  const m = marcaDe(b.marca, b.nombre);
  if(m) return badge(m);
  if(/efectivo|cash/i.test(b.nombre) && b.moneda==='ARS') return '<div class="ico">💵</div>';
  return `<div class="ico">${iconoMoneda(b.moneda)}</div>`;
}
function badge(m, extra=''){
  const fs = m.ini.length>=4?11 : m.ini.length===3?13 : 16;
  return `<div class="ico marca" style="background:${m.bg};color:${m.fg};font-size:${fs}px;${extra}">${m.ini}</div>`;
}
// Mini tarjeta de crédito con el color del banco
function miniTarjeta(d){
  const m = marcaDe(d.marca, d.quien);
  const bg = m ? m.bg : '#3a4150';
  const fg = m ? m.fg : '#fff';
  return `<div class="mini-card" style="background:linear-gradient(135deg, ${bg}, ${oscurecer(bg)});color:${fg}">
    <span class="mc-banco">${m?m.ini:'💳'}</span><span class="mc-chip"></span><span class="mc-red">${esc(({Mastercard:'Master'})[d.red]||d.red||'')}</span></div>`;
}
function oscurecer(hex){
  const n = parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*.6), g=Math.round(((n>>8)&255)*.6), b=Math.round((n&255)*.6);
  return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ---------- Rendimiento (TNA) ----------
function rendimiento(saldo, tna){
  if(!tna || saldo<=0) return null;
  return { dia: saldo*tna/100/365, mes: saldo*tna/100/12 };
}

// ----- Conversión entre monedas con la cotización del día -----
function desdePesos(pesos, moneda){
  if(pesos==null) return null;
  if(moneda==='ARS') return pesos;
  if(moneda==='USDT') return state.usdt.valor ? pesos/state.usdt.valor : null;
  return state.dolar.valor ? pesos/state.dolar.valor : null;
}
function convertir(monto, de, a){ return de===a ? monto : desdePesos(aPesos(monto,de), a); }
function nombreDolar(){ return TIPOS_DOLAR.find(t=>t.id===state.dolar.tipo)?.nombre || ''; }
// "≈ $ 24.000" para mostrar al lado de montos en dólares
function enPesosTxt(monto, moneda){
  if(moneda==='ARS') return '';
  const p = aPesos(monto, moneda);
  return p==null ? '' : `≈ ${plata(Math.round(p))}`;
}

function iconoSuscripcion(s){

  const m = SERVICIOS.find(x => x.buscar.some(p => p.length<=3 ? t.includes(' '+p+' ') : t.includes(p))) || marcaDe('', s.nombre);
  return m ? badge(m) : `<div class="ico">${/gym|gimnasio/i.test(s.nombre)?'🏋️':'🔁'}</div>`;
}
function pagadaEsteMes(s){ return s.ultimoPago===mesActual(); }
// Total de mensualidades pasado a pesos (si falta el dólar, muestra los dólares aparte)
function mensualEnPesos(){
  const ars = totalMensual('ARS'), usd = totalMensual('USD'), usdP = aPesos(usd,'USD');
  if(!usd) return plata(ars);
  if(usdP==null) return [ars?plata(ars):'', plata(usd,'USD')].filter(Boolean).join(' + ');
  return `${plata(Math.round(ars+usdP))} <span class="s">(incluye ${plata(usd,'USD')})</span>`;
}
function totalMensual(moneda){ return state.suscripciones.filter(s=>s.moneda===moneda).reduce((a,s)=>a+s.monto,0); }
function nombreExchange(){ return EXCHANGES_USDT.find(e=>e.id===state.usdt.exchange)?.nombre || state.usdt.exchange; }
function iconoMoneda(m){ return m==='USD'?'💵' : m==='USDT'?'🪙' : '👛'; }
function nombreMoneda(m){ return m==='USD'?'Dólares' : m==='USDT'?'USDT' : 'Pesos'; }

      ${gastosUSD ? `<div class="s">+ ${plata(gastosUSD,'USD')} ${usdEnPesos!=null?`(≈ ${plata(usdEnPesos)})`:''}</div>` : ''}
      ${gastosUSD && usdEnPesos!=null ? `<div class="s" style="margin-top:8px">Total en pesos: <b style="color:var(--txt)">${plata(totalMesPesos)}</b></div>`:''}

// ----- Gráfico: gastos de los últimos 6 meses -----
// Colores pensados para que se distingan bien entre sí (también para daltónicos)
const COLORES_GRAF = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9'];
const GRIS_RESTO = '#5b6272';
let desgloseMes = null; // el mes que tocaste en el gráfico (null = ninguno abierto)

function gastosPorCategoria(ym){
  const porCat = {};
  for(const m of state.movimientos){
    if(m.tipo!=='gasto' || !m.fecha.startsWith(ym)) continue;
    const p = aPesos(m.monto, monedaDe(m)); if(p==null) continue;
    porCat[m.categoria] = (porCat[m.categoria]||0) + p;
  }
  return porCat;
}
// "$ 350 mil", "$ 1,2 M": para que entren los números arriba de las barras
function plataCorta(n){
  if(n>=1e6) return '$ ' + (n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1}) + ' M';
  if(n>=1e3) return '$ ' + Math.round(n/1e3) + ' mil';
  return '$ ' + Math.round(n);
}
function tocarMes(ym){
  desgloseMes = desgloseMes===ym ? null : ym;
  mesVisto = ym;
  render();
}
function graficoMeses(){
  const meses = [...Array(6)].map((_,i)=>moverMes(mesActual(), i-5));
  const datos = meses.map(ym=>{ const cats=gastosPorCategoria(ym); return {ym, cats, total:Object.values(cats).reduce((a,b)=>a+b,0)}; });
  if(!datos.some(d=>d.total)) return '';

  // Cada categoría tiene SIEMPRE el mismo color: las 7 donde más gastaste en estos meses tienen color propio, el resto va en gris
  const sumas = {};
  datos.forEach(d=>Object.entries(d.cats).forEach(([k,v])=>sumas[k]=(sumas[k]||0)+v));
  const top = Object.entries(sumas).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
  const colorDe = id => top.includes(id) ? COLORES_GRAF[top.indexOf(id)] : GRIS_RESTO;

  const ALTO = 120; // alto máximo de una barra, en píxeles
  const max = Math.max(...datos.map(d=>d.total));
  const abierto = datos.find(d=>d.ym===desgloseMes);

  const barra = d => {
    const alto = Math.max(2, Math.round(d.total/max*ALTO));
    if(d!==abierto || !d.total) return `<div class="graf-barra" style="height:${alto}px"><i style="flex:1"></i></div>`;
    // Barra abierta: un pedazo por categoría (abajo las más grandes) y el resto junto en gris
    const resto = Object.entries(d.cats).filter(([id])=>!top.includes(id)).reduce((a,[,v])=>a+v,0);
    const pedazos = top.filter(id=>d.cats[id]).map(id=>({v:d.cats[id], color:colorDe(id)}));
    if(resto) pedazos.push({v:resto, color:GRIS_RESTO});
    return `<div class="graf-barra" style="height:${alto}px">${pedazos.map(p=>`<i style="flex:${p.v} 1 0;min-height:2px;background:${p.color}"></i>`).join('')}</div>`;
  };

  const leyenda = abierto && abierto.total ? `
    <div class="label" style="margin-top:16px">En qué se fue la plata en ${nombreMes(abierto.ym)}</div>
    <div class="leyenda">${Object.entries(abierto.cats).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{ const c=categoria(id);
      return `<div class="row"><span><i class="punto" style="background:${colorDe(id)}"></i>${c.emoji} ${c.nombre}</span>
        <span><b>${plata(Math.round(v))}</b> <span class="s">${Math.round(v/abierto.total*100)}%</span></span></div>`;}).join('')}</div>`
    : `<p class="s" style="text-align:center;margin:12px 0 0">Tocá un mes para ver en qué se fue la plata.</p>`;

  return `<div class="card">
    <div class="label">Gastos de los últimos 6 meses (en pesos)</div>
    <div class="graf">
      ${datos.map(d=>`<button class="graf-col ${d===abierto?'on':''}" onclick="tocarMes('${d.ym}')" aria-label="${nombreMes(d.ym)}: ${plata(Math.round(d.total))}">
        <span class="graf-val">${d.total?plataCorta(d.total):''}</span>
        ${barra(d)}
        <span class="graf-mes">${nombreMes(d.ym).slice(0,3)}</span>
      </button>`).join('')}
    </div>
    ${leyenda}
  </div>`;
}

// Hoja de pago compartida por cuotas y mensualidades.
// Siempre registra el movimiento (así se descuenta de la billetera) con la fecha de hoy.
function hojaPago({titulo, detalle, monto, moneda, preferida, pregunta, alConfirmar}){
  // Primero las billeteras de la misma moneda
  const billes = [...state.billeteras].sort((a,b)=>(b.moneda===moneda)-(a.moneda===moneda));
  const elegida = billes.find(b=>b.id===preferida && b.moneda===moneda) || billes[0];
  abrirSheet(`
    <h3>${titulo}</h3>
    <p class="sub">${detalle} · ${plata(monto,moneda)}${moneda!=='ARS'&&aPesos(monto,moneda)!=null?` (${enPesosTxt(monto,moneda)})`:''}</p>
    <label>${pregunta}</label>
    ${chipsBilleteras('pagoBille', elegida?.id, billes)}
    <div class="conv" id="pagoConv"></div>
    <div class="actions"><button class="btn" id="pagoOk">Confirmar</button></div>`);
  const montoEn = id => { const b=billetera(id); return b ? convertir(monto, moneda, b.moneda) : null; };
  const mostrar = () => {
    const b = billetera($('#pagoBille').dataset.v); if(!b) return;
    const m = montoEn(b.id);
    $('#pagoConv').innerHTML = b.moneda===moneda ? `Se descuenta ${plata(monto,moneda)} de ${esc(b.nombre)}.`
      : m==null ? `⚠️ Falta la cotización para pasar a ${nombreMoneda(b.moneda).toLowerCase()}. Actualizala en Ajustes.`
      : `Se descuentan <b style="color:var(--txt)">${plata(Math.round(m*100)/100,b.moneda)}</b> de ${esc(b.nombre)} (dólar ${nombreDolar()} de hoy).`;
  };
  $('#pagoBille').addEventListener('cambio', mostrar); mostrar();
  $('#pagoOk').onclick = () => {
    const b = billetera($('#pagoBille').dataset.v); if(!b) return toast('Elegí una billetera');
    const m = montoEn(b.id); if(m==null) return toast('Falta la cotización del dólar');
    alConfirmar(b, Math.round(m*100)/100);
  };
}

function pagarCuota(id){
  const d = state.deudas.find(x=>x.id===id); if(!d) return;
  const debo = d.direccion==='debo';
  hojaPago({
    titulo: `${debo?'Pagar cuota':'Registrar cobro'} ${d.cuotasPagadas+1}/${d.cuotasTotales}`,
    detalle: esc(d.descripcion), monto: d.montoCuota, moneda: d.moneda,
    pregunta: debo ? '¿De qué billetera sale?' : '¿A qué billetera entra?',
    alConfirmar: (b, monto) => {
      d.cuotasPagadas = Math.min(d.cuotasTotales, d.cuotasPagadas+1);
      const conv = b.moneda!==d.moneda ? ` · ${plata(d.montoCuota,d.moneda)}` : '';
      state.movimientos.push({id:uid(), tipo: debo?'gasto':'ingreso', monto, billeteraId:b.id,
        categoria: debo?'cuotas':'otros_i', fecha:hoyISO(), nota:`${d.descripcion} (${d.cuotasPagadas}/${d.cuotasTotales})${conv}`});
      save(); cerrarSheet(); render();
      toast(d.cuotasPagadas>=d.cuotasTotales ? '🎉 ¡Terminaste de pagarla!' : '✅ Cuota registrada');
    }
  });
}

function pagarMensualidad(id){
  const su = state.suscripciones.find(x=>x.id===id); if(!su) return;
  hojaPago({
    titulo: `Pagar ${esc(su.nombre)}`, detalle: nombreMes(mesActual()), monto: su.monto, moneda: su.moneda,
    preferida: su.billeteraId, pregunta: '¿De qué billetera sale?',
    alConfirmar: (b, monto) => {
      su.ultimoPago = mesActual();
      const conv = b.moneda!==su.moneda ? ` · ${plata(su.monto,su.moneda)}` : '';
      state.movimientos.push({id:uid(), tipo:'gasto', monto, billeteraId:b.id, categoria:'subs', fecha:hoyISO(),
        nota:`${su.nombre} (${nombreMes(mesActual())})${conv}`});
      save(); cerrarSheet(); render(); toast('✅ Mensualidad pagada');
    }
  });
}

function exportar(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const nombre = `finanzas-respaldo-${hoyISO()}.json`;
  const file = new File([blob], nombre, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:'Respaldo Mis Finanzas'}).catch(()=>{});
  }else{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
  }
}
function importar(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.billeteras) throw 0;
      if(!confirm('Esto reemplaza tus datos actuales por los del respaldo. ¿Seguimos?')) return;
      state=Object.assign(estadoVacio(),data); save(); render(); toast('✅ Respaldo restaurado');
    }catch(e){ toast('Ese archivo no es un respaldo válido'); }
  };
  r.readAsText(f);
}
function borrarTodo(){
  if(!confirm('¿Seguro? Se borra TODO y no se puede deshacer.')) return;
  state=estadoVacio(); save(); vista='inicio'; render();
}

// Mientras la hoja está abierta, la pantalla de atrás queda "congelada" para que no se mueva al deslizar
function bloquearFondo(){
  if(document.body.dataset.bloqueado) return;
  const y = window.scrollY;
  document.body.dataset.bloqueado = y;
  Object.assign(document.body.style, {position:'fixed', top:`-${y}px`, left:'0', right:'0'});
}
function desbloquearFondo(){
  if(!document.body.dataset.bloqueado) return;
  const y = Number(document.body.dataset.bloqueado);
  delete document.body.dataset.bloqueado;
  Object.assign(document.body.style, {position:'', top:'', left:'', right:''});
  window.scrollTo(0, y);
}
function abrirSheet(html){ bloquearFondo();  $('#sheet').innerHTML = '<div class="handle"></div><button class="cerrar" onclick="cerrarSheet()" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + html; $('#overlay').classList.add('open'); $('#fab').style.visibility='hidden'; }
function cerrarSheet(){ desbloquearFondo(); $('#overlay').classList.remove('open'); $('#fab').style.visibility=''; }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') cerrarSheet(); });

// Botón +: depende de la pantalla
$('#fab').addEventListener('click', ()=>{

});

    $('#mCats').innerHTML = cats.map(c=>`<button class="chip ${c.id===catMov?'on':''}" onclick="catMov='${c.id}';this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${c.emoji} ${c.nombre}</button>`).join('');
    document.querySelectorAll('#mTipo button').forEach(b=>b.classList.toggle('on', b.dataset.t===tipoMov));

  };

    <h3>${m?'Editar':'Nuevo'} movimiento</h3>
    <div class="seg" id="mTipo">

    <div class="chips" id="mCats"></div>
    <label>Nota (opcional)</label>
    <input id="mNota" placeholder="Ej: hamburguesa con los pibes" value="${esc(m?m.nota:'')}">
    <label>Fecha</label>
    <input id="mFecha" type="date" value="${m?m.fecha:hoyISO()}">
    <div class="actions">
      <button class="btn" onclick="guardarMovimiento('${id||''}')">Guardar</button>
      ${m?`<button class="btn danger" onclick="borrar('movimientos','${id}')">Eliminar</button>`:''}
    </div>`);
  document.querySelectorAll('#mTipo button').forEach(b=>b.onclick=()=>{ tipoMov=b.dataset.t; catMov = tipoMov==='gasto'?'comida':'laburo'; pintar(); });

function guardarDeuda(id){
  const {clase,dir,mon,red,marca} = formDeuda._get();

  const montoCuota=num($('#dMonto').value), cuotasTotales=parseInt($('#dTot').value)||1;

  const cuotasPagadas=Math.min(cuotasTotales, parseInt($('#dPag').value)||0);
  const dia=Math.min(31,Math.max(0,parseInt($('#dDia').value)||0));
  const datos={clase, direccion:dir, descripcion, quien:$('#dQuien').value.trim(), moneda:mon, montoCuota, cuotasTotales, cuotasPagadas, diaVencimiento:dia,
               red: clase==='tarjeta'?red:'', marca: clase==='tarjeta'?marca:''};
  if(id) Object.assign(state.deudas.find(x=>x.id===id),datos); else state.deudas.push({id:uid(),...datos});
  filtroDeuda = dir;
  save(); cerrarSheet(); render(); toast('💳 Guardado');
}

    </div>`);
  const pint=()=>document.querySelectorAll('#iMon button').forEach(x=>x.classList.toggle('on',x.dataset.v===mon));
  document.querySelectorAll('#iMon button').forEach(x=>x.onclick=()=>{mon=x.dataset.v;pint();});
  pint();
  formInversion._mon=()=>mon;
}
function guardarInversion(id){
  const nombre=$('#iNombre').value.trim(); if(!nombre) return toast('Poné un nombre');
  const invertido=num($('#iInv').value); if(invertido<=0) return toast('¿Cuánto pusiste?');
  const valorActual = $('#iAct').value.trim() ? num($('#iAct').value) : invertido;
  const datos={nombre, tipo:$('#iTipo').value, moneda:formInversion._mon(), invertido, valorActual, actualizado:Date.now()};
  if(id) Object.assign(state.inversiones.find(x=>x.id===id),datos); else state.inversiones.push({id:uid(),...datos});
  save(); cerrarSheet(); render(); toast('📈 Inversión guardada');
}

function borrar(coleccion, id){
  if(!confirm('¿Eliminar?')) return;
  state[coleccion] = state[coleccion].filter(x=>x.id!==id);
  save(); cerrarSheet(); render();
}

// ============================================================
//  MODO CLARO / OSCURO
// ============================================================
const celuOscuro = window.matchMedia('(prefers-color-scheme: dark)');
function aplicarTema(){
  const t = state.tema || 'auto';
  const oscuro = t==='oscuro' || (t==='auto' && celuOscuro.matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  // Color de la barra de arriba del celu
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--barra-sup').trim();
}
function cambiarTema(t){ state.tema=t; save(); aplicarTema(); render(); }
celuOscuro.addEventListener('change', aplicarTema); // si cambiás el modo del celu con la app abierta

// ============================================================
//  ARRANQUE
// ============================================================
aplicarTema();
render();

// El botón + se esconde al bajar por la pantalla (para no tapar nada) y vuelve al subir
let ultimoScroll = 0;
window.addEventListener('scroll', ()=>{
  if(document.body.dataset.bloqueado) return;            // con una hoja abierta no hacemos nada
  const y = window.scrollY;
  $('#fab').classList.toggle('escondido', y > ultimoScroll && y > 80);
  ultimoScroll = y;
}, {passive:true});
if(state.usuario){ actualizarDolar(); actualizarUSDT(); }
// Pedirle al navegador que no borre los datos
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
// Modo offline: registra el service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
