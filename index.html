    <label>¿Cuánto tenés hoy ahí?</label>
    <input id="bSaldo" inputmode="decimal" placeholder="0" value="${b?b.saldoInicial:''}">
    <p class="s">Es el saldo de arranque. Después se mueve solo con tus gastos e ingresos.</p>
    <label>¿Rinde? Tasa nominal anual (TNA %)</label>
    <input id="bTna" inputmode="decimal" placeholder="Ej: 2,71 (dejalo vacío si no rinde)" value="${b&&b.tna?String(b.tna).replace('.',','):''}">
    <p class="s" id="bTnaAyuda"></p>
    <label>Ícono</label>
    ${selectorMarcas('bMarca', b?b.marca:'')}
    <div class="actions">
      <button class="btn" onclick="guardarBilletera('${id||''}')">Guardar</button>
      ${b?`<button class="btn danger" onclick="borrarBilletera('${id}')">Eliminar</button>`:''}
    </div>`);
  let marca = b?(b.marca||''):'';
  activarSelectorMarcas('bMarca', idM=>{
    marca = idM;
    const m = MARCAS.find(x=>x.id===idM);
    if(m && !$('#bNombre').value.trim()) $('#bNombre').value = m.nombre; // completa el nombre si estaba vacío
  });
  formBilletera._marca = ()=>marca;
  let mon = b?b.moneda:'ARS';
  const pint=()=>document.querySelectorAll('#bMon button').forEach(x=>x.classList.toggle('on',x.dataset.m===mon));
  document.querySelectorAll('#bMon button').forEach(x=>x.onclick=()=>{mon=x.dataset.m;pint();});
  pint();
  formBilletera._mon = ()=>mon;
  // Aviso de si la tasa se actualiza sola, según la marca y la moneda elegidas
  const ayuda = ()=>{
    const f = fuenteTasa({marca:formBilletera._marca(), nombre:$('#bNombre').value, moneda:mon});
    $('#bTnaAyuda').innerHTML = !f ? 'La tasa cambia seguido: cuando la veas distinta en tu app, la actualizás acá.'
      : b && b.tnaManual ? `La cargaste a mano, así que no se actualiza sola.<br>Borrala y guardá para que vuelva a ser automática (sale de ${f.texto}).`
      : `Se actualiza sola todos los días, con ${f.texto}.<br>Si la cambiás a mano, deja de actualizarse sola.`;
  };
  ayuda();
  $('#bNombre').addEventListener('input', ayuda);
  document.querySelectorAll('#bMon button').forEach(x=>x.addEventListener('click', ayuda));
  $('#bMarca')?.addEventListener('click', ()=>setTimeout(ayuda));
}
function guardarBilletera(id){
  const nombre=$('#bNombre').value.trim(); if(!nombre) return toast('Poné un nombre');
  const datos={nombre, moneda:formBilletera._mon(), saldoInicial:num($('#bSaldo').value),
               tna:num($('#bTna').value)||0, marca:formBilletera._marca()};
  // Tasa automática: si la dejás vacía o igual a la automática, se sigue actualizando sola; si la cambiás, queda a mano
  const f = fuenteTasa(datos), auto = state.tasas?.valores?.[claveTasa(datos)];
  let manual = false;
  if(f && datos.tna){
    const antes = id ? billetera(id) : null;
    manual = antes && datos.tna===antes.tna ? !!antes.tnaManual : datos.tna!==auto;
  }
  datos.tnaManual = manual;
  if(id) Object.assign(billetera(id),datos); else state.billeteras.push({id:uid(),...datos});
  aplicarTasas();
  save(); cerrarSheet(); render(); toast('Billetera guardada');
  if(f && !datos.tnaManual) actualizarTasas(true);
}
function borrarBilletera(id){
  const usados = state.movimientos.filter(m=>m.billeteraId===id).length;
  if(!confirm(usados?`Tiene ${usados} movimientos. Si la borrás, se borran también. ¿Seguimos?`:'¿Borrar esta billetera?')) return;
  state.movimientos = state.movimientos.filter(m=>m.billeteraId!==id);
  state.billeteras = state.billeteras.filter(b=>b.id!==id);
  save(); cerrarSheet(); render();
}

// ----- Cuota / deuda -----
function formDeuda(id){

  abrirSheet(`
    <h3>${d?'Editar':'Nueva'} cuota / deuda</h3>
    <div class="seg" id="dClase"><button data-v="tarjeta">${ici('tarjeta')} Tarjeta</button><button data-v="persona">${ici('personas')} Persona</button>${d?'':`<button data-v="mensual">${ici('repetir')} Mensual</button>`}</div>
    <div id="dDirWrap" style="margin-top:10px"><div class="seg" id="dDir"><button data-v="debo">Yo le debo</button><button data-v="medeben">Me debe</button></div></div>
    <label>¿Qué es?</label>
    <input id="dDesc" placeholder="Ej: Zapatillas, Celular, Préstamo" value="${esc(d?d.descripcion:'')}">
    <label id="dQuienLbl">Tarjeta</label>
    <input id="dQuien" placeholder="Ej: Galicia" value="${esc(d?d.quien:'')}">
    <div id="dTarjetaWrap">
      <label>Red de la tarjeta</label>
      <div class="chips" id="dRed">${REDES_TARJETA.map(r=>`<button type="button" class="chip" data-v="${r}">${r}</button>`).join('')}</div>
      <label>Banco / billetera (para el color)</label>
      ${selectorMarcas('dMarca', d?d.marca:'')}
    </div>
    <label>Moneda</label>
    <div class="seg" id="dMon"><button data-v="ARS">Pesos</button><button data-v="USD">Dólares</button></div>
    <div class="grid2">
      <div><label>Monto de cada cuota</label><input id="dMonto" inputmode="decimal" placeholder="0" value="${d?d.montoCuota:''}"></div>
      <div><label>Cantidad de cuotas</label><input id="dTot" inputmode="numeric" placeholder="12" value="${d?d.cuotasTotales:''}"></div>
      <div><label>Ya pagadas</label><input id="dPag" inputmode="numeric" placeholder="0" value="${d?d.cuotasPagadas:''}"></div>
      <div><label>Día de vencimiento</label><input id="dDia" inputmode="numeric" placeholder="10" value="${d?d.diaVencimiento||'':''}"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="guardarDeuda('${id||''}')">Guardar</button>
      ${d?`<button class="btn danger" onclick="borrar('deudas','${id}')">Eliminar</button>`:''}
    </div>`);
  const pint=()=>{
    document.querySelectorAll('#dClase button').forEach(x=>x.classList.toggle('on',x.dataset.v===clase));
    document.querySelectorAll('#dDir button').forEach(x=>x.classList.toggle('on',x.dataset.v===dir));
    document.querySelectorAll('#dMon button').forEach(x=>x.classList.toggle('on',x.dataset.v===mon));
    $('#dDirWrap').style.display = clase==='persona'?'block':'none';
    $('#dQuienLbl').textContent = clase==='tarjeta'?'Banco o billetera de la tarjeta':'Persona';
    $('#dQuien').placeholder = clase==='tarjeta'?'Ej: Galicia':'Ej: Juan';
    $('#dTarjetaWrap').style.display = clase==='tarjeta'?'block':'none';
    document.querySelectorAll('#dRed .chip').forEach(x=>x.classList.toggle('on',x.dataset.v===red));
    if(clase==='tarjeta') dir='debo';
  };
  let red = d?(d.red||''):'', marca = d?(d.marca||''):'';
  document.querySelectorAll('#dRed .chip').forEach(x=>x.onclick=()=>{red = red===x.dataset.v?'':x.dataset.v; pint();});
  activarSelectorMarcas('dMarca', idM=>{
    marca = idM;
    const m = MARCAS.find(x=>x.id===idM);
    if(m && !$('#dQuien').value.trim()) $('#dQuien').value = m.nombre;
  });
  document.querySelectorAll('#dClase button').forEach(x=>x.onclick=()=>{ if(x.dataset.v==='mensual') return formSuscripcion(); clase=x.dataset.v; pint(); });
  document.querySelectorAll('#dDir button').forEach(x=>x.onclick=()=>{dir=x.dataset.v;pint();});
  document.querySelectorAll('#dMon button').forEach(x=>x.onclick=()=>{mon=x.dataset.v;pint();});
  pint();
  formDeuda._get = ()=>({clase,dir,mon,red,marca});

function guardarDeuda(id){
  const {clase,dir,mon,red,marca} = formDeuda._get();
  const descripcion=$('#dDesc').value.trim(); if(!descripcion) return toast('¿Qué es la cuota?');
  const montoCuota=num($('#dMonto').value), cuotasTotales=parseInt($('#dTot').value)||1;
  if(montoCuota<=0) return toast('Poné el monto de la cuota');
  const cuotasPagadas=Math.min(cuotasTotales, parseInt($('#dPag').value)||0);
  const dia=Math.min(31,Math.max(0,parseInt($('#dDia').value)||0));
  const datos={clase, direccion:dir, descripcion, quien:$('#dQuien').value.trim(), moneda:mon, montoCuota, cuotasTotales, cuotasPagadas, diaVencimiento:dia,
               red: clase==='tarjeta'?red:'', marca: clase==='tarjeta'?marca:''};
  if(id){
    const d = state.deudas.find(x=>x.id===id);
    if(cuotasPagadas > d.cuotasPagadas) datos.ultimoPago = mesActual(); // si subiste "Ya pagadas" a mano, cuenta como pagada este mes
    // Historial: si ahora quedó completa, se terminó hoy; si la bajaste, deja de estar terminada
    datos.terminada = cuotasPagadas>=cuotasTotales ? (d.terminada || hoyISO()) : null;
    Object.assign(d,datos);
  } else state.deudas.push({id:uid(), creada:Date.now(), ...datos, terminada: cuotasPagadas>=cuotasTotales ? hoyISO() : null});
  filtroDeuda = dir;
  save(); cerrarSheet(); render(); toast('Guardado');
}

const celuOscuro = window.matchMedia('(prefers-color-scheme: dark)');
function aplicarTema(){
  const t = state.tema || 'auto';
  const oscuro = t==='oscuro' || (t==='auto' && celuOscuro.matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  // Color de la barra de arriba del celu
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--barra-sup').trim();
}
function cambiarTema(t){ state.tema=t; save(); aplicarTema(); render(); }
celuOscuro.addEventListener('change', aplicarTema); // si cambiás el modo del celu con la app abierta

// ============================================================
//  EFECTO AL BAJAR
//  - Los bloques que vienen de abajo aparecen agrupados (montados sobre el de arriba),
//    más chicos y transparentes, y se despliegan a medida que suben.
//  - Sin desenfoque (blur): en el iPhone el blur en movimiento dejaba rayitas fucsias sueltas.
//  - Los que se van por arriba se achican y se apilan atrás del siguiente.
//  Si todo entra en la pantalla, no pasa nada.
// ============================================================
const ZONA_ABAJO = 160, ZONA_ARRIBA = 110;
const limitar = (x,a,b)=>Math.min(b,Math.max(a,x));
let efectoPendiente = false;
function efectoScroll(){
  efectoPendiente = false;
  const bloques = [...$('#main').children];
  const hayParaBajar = document.documentElement.scrollHeight > window.innerHeight + 20;
  const piso = window.innerHeight - ($('#nav').offsetHeight || 0); // donde empieza la barra de abajo
  for(const el of bloques){
    if(!hayParaBajar || !state.usuario){ el.style.transform = el.style.opacity = el.style.zIndex = ''; continue; }
    const r = el.getBoundingClientRect();
    const abajo  = 1 - limitar((piso - r.top) / ZONA_ABAJO, 0, 1);   // 1 = recién asomando abajo, 0 = ya desplegado
    const arriba = 1 - limitar(r.bottom / ZONA_ARRIBA, 0, 1);        // 1 = casi fuera por arriba, 0 = normal
    if(abajo > 0){
      el.style.transform = `translateY(${-abajo*30}px) scale(${1-abajo*.06})`;
      el.style.opacity = (1-abajo*.6).toFixed(2);
      el.style.zIndex = 0;  // queda atrás del bloque de arriba, como agrupado
    } else if(arriba > 0){
      el.style.transform = `translateY(${arriba*22}px) scale(${1-arriba*.08})`;
      el.style.opacity = (1-arriba*.7).toFixed(2);
      el.style.zIndex = 0;  // se mete atrás del siguiente, como apilándose
    } else {
      el.style.transform = el.style.opacity = el.style.zIndex = '';
    }
  }
}
function pedirEfecto(){ if(!efectoPendiente){ efectoPendiente = true; requestAnimationFrame(efectoScroll); } }
window.addEventListener('scroll', pedirEfecto, {passive:true});
window.addEventListener('resize', pedirEfecto);

// ============================================================
//  ANIMACIÓN DE ENTRADA
//  1) aparece el anillo desde el medio, 2) suben las personitas,
//  3) las letras se van escribiendo una por una en su lugar, 4) se desvanece.
//  Tocando la pantalla se saltea.
// ============================================================
function mostrarIntro(){
  const el = $('#intro'); if(!el) return;
  el.innerHTML = logoSello('in');
  // Cada letra pasa a ser un pedacito aparte, invisible al principio y ya en su lugar final
  const letras = [];
  el.querySelectorAll('textPath').forEach(tp=>{
    const texto = tp.textContent; tp.textContent = '';
    for(const ch of texto){
      const sp = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      sp.textContent = ch===' ' ? '\u00A0' : ch;
      sp.setAttribute('fill-opacity','0');   // invisible hasta que le toque
      tp.appendChild(sp); letras.push(sp);
    }
  });
  const inicio = 950, paso = 58;
  letras.forEach((sp,i)=>setTimeout(()=>sp.setAttribute('fill-opacity','1'), inicio + i*paso));
  const fin = inicio + letras.length*paso;
  el.style.setProperty('--fin', fin+'ms');
  let cerrado = false;
  const cerrar = ()=>{ if(cerrado) return; cerrado = true; el.classList.add('fuera'); setTimeout(()=>el.remove(), 500); };
  setTimeout(cerrar, fin + 700);
  el.addEventListener('click', cerrar);
}

// ============================================================
//  ARRANQUE
// ============================================================
aplicarTema();
render();
mostrarIntro();

// El botón + se esconde al bajar por la pantalla (para no tapar nada) y vuelve al subir
let ultimoScroll = 0;
window.addEventListener('scroll', ()=>{
  if(document.body.dataset.bloqueado) return;            // con una hoja abierta no hacemos nada
  const y = window.scrollY;
  $('#fab').classList.toggle('escondido', y > ultimoScroll && y > 80);
  ultimoScroll = y;
}, {passive:true});
if(state.usuario){ actualizarDolar(); actualizarUSDT(); actualizarTasas(); }
// Pedirle al navegador que no borre los datos
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
// Modo offline: registra el service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{}); // revisa si hay versión nueva
  });
  // Cuando llega una versión nueva, la app se recarga sola (una sola vez) para mostrarla
  let recargando = false;
  const habiaVersion = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(recargando || !habiaVersion) return;
    recargando = true; location.reload();
  });
}
